<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admisiones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --marca: #00476c;
  --marca-alta: #0a5e8a;
  --marca-suave: #eaf4fa;

  --fondo: #f5f7f9;
  --superficie: #ffffff;
  --superficie-alta: #fbfcfd;
  --linea: #e3e8ee;
  --linea-fuerte: #cfd8e3;

  --texto: #111a24;
  --texto-medio: #4a5765;
  --texto-suave: #78838f;

  --azul: #0969da;   --azul-bg: #ddf0ff;
  --cyan: #0e7490;   --cyan-bg: #d9f2f7;
  --ambar: #9a6700;  --ambar-bg: #fff3d4;
  --violeta: #6639ba;--violeta-bg: #ece4fb;
  --verde: #1a7f37;  --verde-bg: #d7f5df;
  --rojo: #b02020;   --rojo-bg: #ffe2e0;
  --gris: #57606a;   --gris-bg: #eceff2;

  --sombra-1: 0 1px 2px rgba(16,24,40,.05);
  --sombra-2: 0 4px 12px rgba(16,24,40,.08);
  --sombra-3: 0 16px 40px rgba(16,24,40,.16);

  --r-s: 6px; --r-m: 10px; --r-l: 14px;
  --transicion: 140ms cubic-bezier(.4,0,.2,1);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --marca: #6cb6dd; --marca-alta: #8fc9e8; --marca-suave: #10283a;
    --fondo: #0d1117; --superficie: #151b23; --superficie-alta: #1b222c;
    --linea: #242c38; --linea-fuerte: #333d4b;
    --texto: #e6edf3; --texto-medio: #a8b3c1; --texto-suave: #7d8894;
    --azul: #6cb6ff;   --azul-bg: #0f2b47;
    --cyan: #56d4dd;   --cyan-bg: #0c2f35;
    --ambar: #e3b341;  --ambar-bg: #3a2c0c;
    --violeta: #bc8cff;  --violeta-bg: #2a1f45;
    --verde: #3fb950;  --verde-bg: #0f2f18;
    --rojo: #f85149;   --rojo-bg: #3d1618;
    --gris: #8b949e;   --gris-bg: #21262d;
    --sombra-1: 0 1px 2px rgba(0,0,0,.3);
    --sombra-2: 0 4px 12px rgba(0,0,0,.4);
    --sombra-3: 0 16px 40px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"] {
  --marca: #6cb6dd; --marca-alta: #8fc9e8; --marca-suave: #10283a;
  --fondo: #0d1117; --superficie: #151b23; --superficie-alta: #1b222c;
  --linea: #242c38; --linea-fuerte: #333d4b;
  --texto: #e6edf3; --texto-medio: #a8b3c1; --texto-suave: #7d8894;
  --azul: #6cb6ff;   --azul-bg: #0f2b47;
  --cyan: #56d4dd;   --cyan-bg: #0c2f35;
  --ambar: #e3b341;  --ambar-bg: #3a2c0c;
  --violeta: #bc8cff;--violeta-bg: #2a1f45;
  --verde: #3fb950;  --verde-bg: #0f2f18;
  --rojo: #f85149;   --rojo-bg: #3d1618;
  --gris: #8b949e;   --gris-bg: #21262d;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--fondo);
  color: var(--texto);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

/* ─── Barra superior ─── */
.topbar {
  position: sticky; top: 0; z-index: 30;
  background: var(--superficie);
  border-bottom: 1px solid var(--linea);
  padding: 0 20px;
  height: 60px;
  display: flex; align-items: center; gap: 16px;
}
.marca { display: flex; align-items: center; gap: 9px; font-weight: 650; font-size: 15px; letter-spacing: -.01em; }
.marca svg { width: 22px; height: 22px; color: var(--marca); flex: none; }
.marca span { color: var(--texto-suave); font-weight: 400; }

.buscador { position: relative; flex: 1; max-width: 420px; margin-left: 8px; }
.buscador svg {
  position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
  width: 15px; height: 15px; color: var(--texto-suave); pointer-events: none;
}
.buscador input {
  width: 100%; padding: 8px 12px 8px 33px;
  border: 1px solid var(--linea-fuerte); border-radius: var(--r-m);
  background: var(--superficie-alta); color: var(--texto);
  font: inherit; transition: var(--transicion);
}
.buscador input:focus {
  outline: none; border-color: var(--marca);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--marca) 15%, transparent);
  background: var(--superficie);
}
.buscador input::placeholder { color: var(--texto-suave); }

.usuario { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.usuario .datos { text-align: right; line-height: 1.3; }
.usuario .datos b { display: block; font-size: 13px; font-weight: 550; }
.usuario .datos small { color: var(--texto-suave); font-size: 11.5px; }
.avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--marca); color: #fff;
  display: grid; place-items: center;
  font-size: 12.5px; font-weight: 600; flex: none;
}

/* ─── Contenido ─── */
main { max-width: 1160px; margin: 0 auto; padding: 22px 20px 60px; }

.controles { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
.resumen { color: var(--texto-suave); font-size: 13px; }
.resumen b { color: var(--texto); font-weight: 600; }
.acciones-barra { margin-left: auto; display: flex; gap: 8px; }

/* ─── Días de espera ─── */
.espera {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 12px; font-weight: 550; white-space: nowrap;
  padding: 3px 9px; border-radius: 999px;
}
.espera svg { width: 12px; height: 12px; }
.espera.tranquilo { background: var(--gris-bg);   color: var(--gris); }
.espera.atencion  { background: var(--ambar-bg);  color: var(--ambar); }
.espera.urgente   { background: var(--rojo-bg);   color: var(--rojo); }
.espera.nuestra   { background: var(--violeta-bg);color: var(--violeta); }

/* ─── Checkpoints del recorrido ─── */
.pasos { display: flex; align-items: flex-start; gap: 0; overflow-x: auto; padding: 4px 0 2px; }
.paso {
  flex: 1; min-width: 78px; background: none; border: none; padding: 0;
  cursor: pointer; text-align: center; position: relative;
  font: inherit; color: var(--texto-suave); transition: var(--transicion);
}
.paso::before {
  content: ''; position: absolute; top: 10px; left: -50%; width: 100%;
  height: 2px; background: var(--linea); z-index: 0;
}
.paso:first-child::before { display: none; }
.paso .bolita {
  position: relative; z-index: 1; margin: 0 auto 6px;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--superficie); border: 2px solid var(--linea-fuerte);
  display: grid; place-items: center; transition: var(--transicion);
}
.paso .bolita svg { width: 11px; height: 11px; opacity: 0; transition: var(--transicion); }
.paso .rotulo { font-size: 11px; line-height: 1.25; font-weight: 500; padding: 0 3px; display: block; }

.paso.hecho::before { background: var(--verde); }
.paso.hecho .bolita { background: var(--verde); border-color: var(--verde); color: #fff; }
.paso.hecho .bolita svg { opacity: 1; }
.paso.hecho .rotulo { color: var(--texto-medio); }

.paso.actual .bolita {
  background: var(--marca); border-color: var(--marca); color: #fff;
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--marca) 20%, transparent);
  transform: scale(1.12);
}
.paso.actual .rotulo { color: var(--texto); font-weight: 650; }

.paso:hover:not(.actual) .bolita { border-color: var(--marca); }
.paso:hover .rotulo { color: var(--texto); }

.ramas { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 14px; padding-top: 13px; border-top: 1px solid var(--linea); }
.rama {
  padding: 5px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 500;
  border: 1px solid var(--linea-fuerte); background: var(--superficie);
  color: var(--texto-medio); cursor: pointer; transition: var(--transicion);
}
.rama:hover { border-color: var(--texto-suave); color: var(--texto); }
.rama.activa-lista_espera { background: var(--gris-bg); color: var(--gris); border-color: var(--gris); font-weight: 650; }
.rama.activa-sin_vacante  { background: var(--rojo-bg); color: var(--rojo); border-color: var(--rojo); font-weight: 650; }
.rama.activa-desistio     { background: var(--gris-bg); color: var(--gris); border-color: var(--gris); font-weight: 650; }

button, select {
  font: inherit; color: var(--texto);
  border: 1px solid var(--linea-fuerte); border-radius: var(--r-m);
  background: var(--superficie); padding: 7px 13px;
  cursor: pointer; transition: var(--transicion); font-weight: 500;
}
button:hover:not(:disabled) { background: var(--superficie-alta); border-color: var(--texto-suave); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primario {
  background: var(--marca); border-color: var(--marca); color: #fff; font-weight: 550;
}
:root[data-theme="dark"] button.primario,
html:not([data-theme="light"]) button.primario { color: #0d1117; }
button.primario:hover:not(:disabled) { background: var(--marca-alta); border-color: var(--marca-alta); }
button.sutil { border-color: transparent; background: transparent; color: var(--texto-medio); }
button.sutil:hover:not(:disabled) { background: var(--gris-bg); border-color: transparent; }

/* ─── Tarjetas ─── */
.grilla { display: grid; gap: 9px; }
.tarjeta {
  background: var(--superficie); border: 1px solid var(--linea);
  border-radius: var(--r-l); padding: 14px 16px;
  cursor: pointer; transition: var(--transicion);
  display: flex; align-items: center; gap: 14px;
  box-shadow: var(--sombra-1);
}
.tarjeta:hover {
  border-color: var(--linea-fuerte); box-shadow: var(--sombra-2);
  transform: translateY(-1px);
}
.tarjeta .principal { flex: 1; min-width: 0; }
.tarjeta .nombre {
  font-size: 15px; font-weight: 600; letter-spacing: -.01em;
  display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
}
.tarjeta .meta {
  color: var(--texto-suave); font-size: 12.5px; margin-top: 2px;
  display: flex; gap: 7px; flex-wrap: wrap; align-items: center;
}
.tarjeta .meta .punto { opacity: .45; }

.nivel {
  font-size: 10.5px; font-weight: 650; text-transform: uppercase;
  letter-spacing: .05em; padding: 2px 7px; border-radius: var(--r-s);
  background: var(--gris-bg); color: var(--gris);
}
/* Un color por nivel: con los tres mezclados en una sola lista, el color es
   lo que permite ubicar el nivel sin leer. */
.nivel.n-Inicial    { background: var(--cyan-bg);    color: var(--cyan); }
.nivel.n-Primaria   { background: var(--verde-bg);   color: var(--verde); }
.nivel.n-Secundaria { background: var(--violeta-bg); color: var(--violeta); }

/* Franja lateral de color en la tarjeta, para distinguir de un golpe de vista */
.tarjeta { border-left-width: 3px; }
.tarjeta.n-Inicial    { border-left-color: var(--cyan); }
.tarjeta.n-Primaria   { border-left-color: var(--verde); }
.tarjeta.n-Secundaria { border-left-color: var(--violeta); }

.estado {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 11px; border-radius: 999px;
  font-size: 12px; font-weight: 550; white-space: nowrap;
}
.estado::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.e-nueva               { background: var(--azul-bg);    color: var(--azul); }
.e-contactada          { background: var(--cyan-bg);    color: var(--cyan); }
.e-entrevista_agendada { background: var(--ambar-bg);   color: var(--ambar); }
.e-entrevista_hecha    { background: var(--ambar-bg);   color: var(--ambar); }
.e-visita              { background: var(--violeta-bg); color: var(--violeta); }
.e-matriculada         { background: var(--verde-bg);   color: var(--verde); }
.e-lista_espera        { background: var(--gris-bg);    color: var(--gris); }
.e-sin_vacante         { background: var(--rojo-bg);    color: var(--rojo); }
.e-desistio            { background: var(--gris-bg);    color: var(--gris); }

.marca-inclusion {
  font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: var(--r-s);
  background: var(--violeta-bg); color: var(--violeta);
}

/* ─── Panel lateral ─── */
.velo {
  position: fixed; inset: 0; background: rgba(9,14,20,.45);
  backdrop-filter: blur(2px); z-index: 40;
  opacity: 0; pointer-events: none; transition: opacity 180ms ease;
}
.velo.visible { opacity: 1; pointer-events: auto; }

.panel {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 50;
  width: min(560px, 100vw);
  background: var(--fondo);
  border-left: 1px solid var(--linea);
  box-shadow: var(--sombra-3);
  transform: translateX(100%); transition: transform 220ms cubic-bezier(.32,.72,0,1);
  display: flex; flex-direction: column;
}
.panel.visible { transform: translateX(0); }

.panel-cabeza {
  padding: 18px 22px 14px; border-bottom: 1px solid var(--linea);
  background: var(--superficie); flex: none;
}
.panel-cabeza .fila { display: flex; align-items: flex-start; gap: 12px; }
.panel-cabeza h2 { font-size: 20px; font-weight: 680; letter-spacing: -.02em; flex: 1; line-height: 1.25; }
.panel-cabeza .sub { color: var(--texto-suave); font-size: 13px; margin-top: 5px; }
.cerrar {
  width: 30px; height: 30px; padding: 0; border-radius: var(--r-s);
  display: grid; place-items: center; border-color: transparent; background: transparent;
  color: var(--texto-medio); flex: none;
}
.cerrar:hover { background: var(--gris-bg); }
.cerrar svg { width: 16px; height: 16px; }

.panel-cuerpo { flex: 1; overflow-y: auto; padding: 18px 22px 40px; }

.seccion { margin-bottom: 24px; }
.seccion > h3 {
  font-size: 11px; font-weight: 650; text-transform: uppercase;
  letter-spacing: .07em; color: var(--texto-suave); margin-bottom: 9px;
}

.bloque {
  background: var(--superficie); border: 1px solid var(--linea);
  border-radius: var(--r-l); padding: 14px 16px;
}

.campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 11px; }
.campo label {
  display: block; font-size: 11px; font-weight: 550; color: var(--texto-suave);
  margin-bottom: 3px; letter-spacing: .01em;
}
.campo input, .campo select {
  width: 100%; padding: 6px 9px; font-size: 13.5px;
  border: 1px solid var(--linea-fuerte); border-radius: var(--r-s);
  background: var(--superficie-alta); color: var(--texto);
  font-family: inherit; transition: var(--transicion);
}
.campo input:focus, .campo select:focus {
  outline: none; border-color: var(--marca); background: var(--superficie);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--marca) 14%, transparent);
}

.botonera { display: flex; gap: 8px; flex-wrap: wrap; }
.botonera button { flex: 1; min-width: 130px; justify-content: center; }

/* ─── Recorrido ─── */
.recorrido { position: relative; padding-left: 22px; }
.recorrido::before {
  content: ''; position: absolute; left: 5px; top: 6px; bottom: 6px;
  width: 2px; background: var(--linea); border-radius: 1px;
}
.hito { position: relative; padding-bottom: 18px; }
.hito:last-child { padding-bottom: 0; }
.hito::before {
  content: ''; position: absolute; left: -21px; top: 5px;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--superficie); border: 2px solid var(--linea-fuerte);
}
.hito.mail_enviado::before   { border-color: var(--azul); }
.hito.mail_recibido::before  { border-color: var(--verde); background: var(--verde); }
.hito.llamada::before        { border-color: var(--cyan); }
.hito.cambio_estado::before  { border-color: var(--ambar); }
.hito.pdf_generado::before   { border-color: var(--violeta); }

.hito .cuando { font-size: 11.5px; color: var(--texto-suave); }
.hito .titulo { font-weight: 570; font-size: 13.5px; margin-top: 1px; }
.hito .detalle {
  margin-top: 6px; padding: 9px 11px; border-radius: var(--r-m);
  background: var(--superficie); border: 1px solid var(--linea);
  font-size: 12.5px; color: var(--texto-medio); white-space: pre-wrap;
  max-height: 150px; overflow-y: auto; line-height: 1.5;
}

/* ─── Modal (mail / plantillas) ─── */
.modal {
  position: fixed; inset: 0; z-index: 60; display: none;
  place-items: center; padding: 20px; overflow-y: auto;
  background: rgba(9,14,20,.5); backdrop-filter: blur(2px);
}
.modal.visible { display: grid; }
.modal-caja {
  background: var(--fondo); border-radius: var(--r-l);
  width: 100%; max-width: 660px; margin: auto;
  box-shadow: var(--sombra-3); overflow: hidden;
  display: flex; flex-direction: column; max-height: calc(100vh - 40px);
}
.modal-cabeza {
  padding: 16px 20px; border-bottom: 1px solid var(--linea);
  background: var(--superficie); display: flex; align-items: center; gap: 12px; flex: none;
}
.modal-cabeza h2 { font-size: 17px; font-weight: 650; flex: 1; letter-spacing: -.01em; }
.modal-cuerpo { padding: 18px 20px; overflow-y: auto; flex: 1; }
.modal-pie {
  padding: 13px 20px; border-top: 1px solid var(--linea);
  background: var(--superficie); display: flex; gap: 9px; justify-content: flex-end; flex: none;
}

.sobre { background: var(--superficie); border: 1px solid var(--linea); border-radius: var(--r-m); padding: 11px 14px; margin-bottom: 15px; }
.sobre .linea { display: flex; gap: 9px; font-size: 12.5px; padding: 2px 0; }
.sobre .linea dt { color: var(--texto-suave); min-width: 78px; flex: none; }
.sobre .linea dd { color: var(--texto); font-weight: 500; word-break: break-word; }

label.etiqueta { display: block; font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: var(--texto-suave); margin: 14px 0 6px; }
input.ancho, select.ancho, textarea.ancho {
  width: 100%; padding: 9px 11px; font-size: 13.5px;
  border: 1px solid var(--linea-fuerte); border-radius: var(--r-m);
  background: var(--superficie); color: var(--texto); font-family: inherit;
}
textarea.ancho {
  min-height: 280px; resize: vertical; line-height: 1.6;
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace; font-size: 12.5px;
}
input.ancho:focus, select.ancho:focus, textarea.ancho:focus {
  outline: none; border-color: var(--marca);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--marca) 14%, transparent);
}

/* ─── Avisos ─── */
.aviso {
  padding: 10px 13px; border-radius: var(--r-m); font-size: 13px;
  margin-bottom: 13px; display: flex; gap: 9px; align-items: flex-start; line-height: 1.5;
}
.aviso svg { width: 15px; height: 15px; flex: none; margin-top: 2px; }
.aviso.ok    { background: var(--verde-bg); color: var(--verde); }
.aviso.avisa { background: var(--ambar-bg); color: var(--ambar); }
.aviso.mal   { background: var(--rojo-bg);  color: var(--rojo); }

.flotante {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(80px);
  z-index: 80; padding: 11px 18px; border-radius: 999px;
  background: var(--texto); color: var(--fondo);
  font-size: 13.5px; font-weight: 500; box-shadow: var(--sombra-3);
  opacity: 0; transition: all 260ms cubic-bezier(.32,.72,0,1); pointer-events: none;
}
.flotante.visible { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ─── Vacíos y carga ─── */
.vacio { text-align: center; padding: 70px 20px; color: var(--texto-suave); }
.vacio svg { width: 40px; height: 40px; opacity: .3; margin-bottom: 12px; }
.vacio p { font-size: 14px; }

.esqueleto { background: var(--superficie); border: 1px solid var(--linea); border-radius: var(--r-l); height: 68px; margin-bottom: 9px; overflow: hidden; position: relative; }
.esqueleto::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--texto-suave) 9%, transparent), transparent);
  animation: brillo 1.4s infinite;
}
@keyframes brillo { to { transform: translateX(100%); } }

/* ─── Login ─── */
.login {
  position: fixed; inset: 0; z-index: 90; display: none;
  place-items: center; background: var(--fondo); padding: 20px;
}
.login.visible { display: grid; }
.login-caja {
  background: var(--superficie); border: 1px solid var(--linea);
  border-radius: 18px; padding: 38px 34px; text-align: center;
  max-width: 380px; width: 100%; box-shadow: var(--sombra-2);
}
.login-caja svg.logo { width: 38px; height: 38px; color: var(--marca); margin-bottom: 16px; }
.login-caja h1 { font-size: 21px; font-weight: 680; letter-spacing: -.02em; }
.login-caja p { color: var(--texto-suave); margin: 7px 0 24px; font-size: 13.5px; }
#botonGoogle { display: flex; justify-content: center; min-height: 44px; }

code {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: .88em; background: var(--gris-bg); padding: 1px 5px; border-radius: 4px;
}

@media (max-width: 640px) {
  .topbar { padding: 0 14px; gap: 10px; }
  .usuario .datos { display: none; }
  .buscador { max-width: none; }
  main { padding: 16px 14px 50px; }
  .panel { width: 100vw; }
  .acciones-barra { width: 100%; margin-left: 0; }
  .acciones-barra button { flex: 1; }
}
</style>
</head>
<body>

<!-- Login (sólo fuera de Apps Script) -->
<div class="login" id="login">
  <div class="login-caja">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
      <path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>
    </svg>
    <h1>Admisiones</h1>
    <p>Colegio San Carlos Diálogos</p>
    <div id="botonGoogle"></div>
    <div id="errorLogin" style="margin-top:16px"></div>
  </div>
</div>

<header class="topbar">
  <div class="marca">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
      <path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>
    </svg>
    Admisiones <span>San Carlos</span>
  </div>

  <div class="buscador">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
    </svg>
    <input id="buscar" placeholder="Buscar alumno, familia o mail…" autocomplete="off">
  </div>

  <div class="usuario">
    <div class="datos"><b id="uNombre"></b><small id="uNiveles"></small></div>
    <div class="avatar" id="uAvatar"></div>
  </div>
</header>

<main>
  <div class="controles">
    <div id="resumen" class="resumen"></div>
    <div class="acciones-barra">
      <button id="btnImportar">Importar del sitio</button>
      <button id="btnPlantillas">Plantillas</button>
    </div>
  </div>

  <div id="lista"></div>
</main>

<div class="velo" id="velo"></div>

<aside class="panel" id="panel" aria-hidden="true"></aside>

<div class="modal" id="modal"></div>

<div class="flotante" id="flotante"></div>

<script>
/* ───────────────────────────────────────────────────────────
   Transporte

   El mismo archivo anda servido por Apps Script y desde Vercel.
   Bajo Apps Script existe google.script.run y Google ya autenticó.
   Desde afuera se manda el ID token de Google en cada llamada.

   El Content-Type es text/plain a propósito: así el navegador lo
   trata como "simple request" y no dispara el preflight OPTIONS,
   que las web apps de Apps Script no contestan.
   ─────────────────────────────────────────────────────────── */

var URL_API = '';    // URL de la web app (/exec) — sólo para Vercel
var CLIENT_ID = '';  // Client ID de OAuth       — sólo para Vercel

var idToken = null;
var enAppsScript = typeof google !== 'undefined' && google.script && google.script.run;

function api(accion, params) {
  if (enAppsScript) {
    return new Promise(function (ok, mal) {
      google.script.run
        .withSuccessHandler(ok)
        .withFailureHandler(function (e) { mal(new Error(e.message || e)); })
        .llamar(accion, params || {});
    });
  }
  return fetch(URL_API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ accion: accion, params: params || {}, id_token: idToken })
  }).then(function (r) { return r.json(); });
}

/* ─── Estado ─── */

var sesion = null, estados = [], admisiones = [], plantillasCache = null;
var filtros = { texto: '', estado: '', anio: '' };

function esc(t) {
  return (t === null || t === undefined ? '' : String(t))
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

var ICO = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m20 6-11 11-5-5"/></svg>',
  alerta: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
  cerrar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  vacio: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 13V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h7"/><path d="M8 9h8M8 13h5"/></svg>'
};

function flotante(texto) {
  var f = document.getElementById('flotante');
  f.textContent = texto;
  f.classList.add('visible');
  clearTimeout(f._t);
  f._t = setTimeout(function () { f.classList.remove('visible'); }, 3400);
}

function aviso(texto, tipo) {
  var icono = tipo === 'mal' || tipo === 'avisa' ? ICO.alerta : ICO.check;
  return '<div class="aviso ' + (tipo || 'ok') + '">' + icono + '<div>' + esc(texto) + '</div></div>';
}

function nombreEstado(id) {
  for (var i = 0; i < estados.length; i++) if (estados[i].id === id) return estados[i].nombre;
  return id || '—';
}

/** Acepta ISO o dd/mm/aaaa, que es como escribe el formulario del sitio. */
function aFecha(valor) {
  if (!valor) return null;
  var t = String(valor).trim();
  var m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  var d = m ? new Date(+m[3], +m[2] - 1, +m[1]) : new Date(t);
  return isNaN(d.getTime()) ? null : d;
}

function fecha(valor) {
  var d = aFecha(valor);
  if (!d) return valor ? String(valor) : '';
  var hoy = new Date();
  var hora = d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
  if (d.toDateString() === hoy.toDateString()) return 'Hoy ' + hora;
  return d.toLocaleDateString('es-AR', { day: 'numeric', month: 'short' }) +
         (d.getFullYear() !== hoy.getFullYear() ? ' ' + d.getFullYear() : '') + ', ' + hora;
}

/** Fecha en que la familia completó el formulario, sin hora. */
function fechaCorta(valor) {
  var d = aFecha(valor);
  if (!d) return '—';
  return d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function iniciales(nombre) {
  return (nombre || '?').trim().split(/\s+/).slice(0, 2)
    .map(function (p) { return p[0]; }).join('').toUpperCase();
}

function esVerdadero(v) { return v === true || v === 'TRUE' || v === 'true'; }

/* ─── Arranque ─── */

function arrancar() {
  api('sesion').then(function (r) {
    if (!r.ok) { document.getElementById('lista').innerHTML = aviso(r.error, 'mal'); return; }

    sesion = r.usuario;
    estados = r.estados;

    document.getElementById('uNombre').textContent = sesion.nombre || sesion.email;
    document.getElementById('uNiveles').textContent =
      sesion.rol === 'admin' ? 'Todos los niveles' : sesion.niveles.join(' · ');
    document.getElementById('uAvatar').textContent = iniciales(sesion.nombre || sesion.email);
    document.getElementById('login').classList.remove('visible');
    cargar();
  }).catch(function (e) {
    document.getElementById('lista').innerHTML = aviso(e.message, 'mal');
  });
}

function cargar() {
  var lista = document.getElementById('lista');
  if (!admisiones.length) {
    lista.innerHTML = '<div class="esqueleto"></div><div class="esqueleto"></div><div class="esqueleto"></div>';
  }

  api('listar', filtros).then(function (r) {
    if (!r.ok) { lista.innerHTML = aviso(r.error, 'mal'); return; }
    admisiones = r.admisiones;
    pintarLista();
  }).catch(function (e) { lista.innerHTML = aviso(e.message, 'mal'); });
}

/**
 * Cuán urgente es una espera. Las tres situaciones tienen umbrales distintos
 * a propósito: que una familia nos haya respondido y no le contestemos es
 * peor que estar esperando que conteste ella.
 */
function urgencia(espera) {
  if (!espera || espera.dias === null || espera.dias === undefined) return null;
  var d = espera.dias;

  if (espera.tipo === 'nos_responden') return d >= 1 ? 'nuestra' : 'tranquilo';
  if (espera.tipo === 'sin_contactar') return d >= 3 ? 'urgente' : (d >= 1 ? 'atencion' : 'tranquilo');
  if (espera.tipo === 'esperando')     return d >= 8 ? 'urgente' : (d >= 3 ? 'atencion' : 'tranquilo');
  return null;
}

var RELOJ = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function textoEspera(espera) {
  var nivel = urgencia(espera);
  if (!nivel) return '';

  var d = espera.dias;
  var cuanto = d === 0 ? 'hoy' : (d === 1 ? '1 día' : d + ' días');
  var que = {
    sin_contactar: 'sin contactar',
    esperando: 'esperando respuesta',
    nos_responden: 'respondieron hace'
  }[espera.tipo];

  var texto = espera.tipo === 'nos_responden'
    ? 'Respondieron hace ' + cuanto
    : cuanto + ' ' + que;

  return '<span class="espera ' + nivel + '" title="' + esc(texto) + '">' +
    RELOJ + esc(d === 0 ? 'Hoy' : d + 'd') + '</span>';
}

function pintarLista() {
  var lista = document.getElementById('lista');

  var pendientes = admisiones.filter(function (a) { return urgencia(a.espera) === 'urgente' || urgencia(a.espera) === 'nuestra'; });
  document.getElementById('resumen').innerHTML = admisiones.length
    ? '<b>' + admisiones.length + '</b> admisiones' +
      (pendientes.length ? ' · <b>' + pendientes.length + '</b> necesitan atención' : '')
    : '';

  if (!admisiones.length) {
    lista.innerHTML = '<div class="vacio">' + ICO.vacio +
      '<p>No hay admisiones todavía. Probá con “Importar del sitio”.</p></div>';
    return;
  }

  lista.innerHTML = '<div class="grilla">' + admisiones.map(function (a) {
    return '<article class="tarjeta n-' + esc(a.nivel) + '" data-id="' + esc(a.id) + '" tabindex="0">' +
      '<div class="principal">' +
        '<div class="meta" style="margin:0 0 3px">' +
          '<span>' + esc(fechaCorta(a.fecha_alta)) + '</span>' +
          '<span class="nivel n-' + esc(a.nivel) + '">' + esc(a.nivel) + '</span>' +
          (esVerdadero(a.inclusion_solicitada)
            ? '<span class="marca-inclusion">inclusión</span>' : '') +
        '</div>' +
        '<div class="nombre">' + esc(a.alumno_nombre) +
          '<span style="font-weight:400;color:var(--texto-suave)"> — ' +
            esc(a.grado_solicitado || '—') + ' — ' + esc(a.anio_vacante || '—') + '</span>' +
        '</div>' +
      '</div>' +
      textoEspera(a.espera) +
      '<span class="estado e-' + esc(a.estado) + '">' + esc(nombreEstado(a.estado)) + '</span>' +
    '</article>';
  }).join('') + '</div>';

  Array.prototype.forEach.call(lista.querySelectorAll('.tarjeta'), function (t) {
    t.onclick = function () { abrirPanel(t.dataset.id); };
    t.onkeydown = function (ev) {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); abrirPanel(t.dataset.id); }
    };
  });
}

/* ─── Panel de la ficha ─── */

function cerrarPanel() {
  document.getElementById('panel').classList.remove('visible');
  document.getElementById('panel').setAttribute('aria-hidden', 'true');
  document.getElementById('velo').classList.remove('visible');
}

function abrirPanel(id) {
  var p = document.getElementById('panel');
  p.classList.add('visible');
  p.setAttribute('aria-hidden', 'false');
  document.getElementById('velo').classList.add('visible');
  p.innerHTML = '<div class="panel-cuerpo"><div class="esqueleto"></div><div class="esqueleto"></div></div>';

  api('detalle', { id: id }).then(function (r) {
    if (!r.ok) {
      p.innerHTML = '<div class="panel-cabeza"><div class="fila"><h2>Error</h2>' +
        '<button class="cerrar" onclick="cerrarPanel()">' + ICO.cerrar + '</button></div></div>' +
        '<div class="panel-cuerpo">' + aviso(r.error, 'mal') + '</div>';
      return;
    }
    pintarPanel(r.admision, r.eventos);
  });
}

function campo(etiq, nombre, valor, tipo) {
  return '<div class="campo"><label>' + esc(etiq) + '</label>' +
    '<input data-campo="' + esc(nombre) + '" type="' + (tipo || 'text') +
    '" value="' + esc(valor) + '"></div>';
}

function pintarPanel(a, eventos) {
  var inc = a.inclusion_solicitada;
  var valorInc = esVerdadero(inc) ? 'si' : (inc === false || inc === 'FALSE' ? 'no' : '');

  document.getElementById('panel').innerHTML =
    '<div class="panel-cabeza">' +
      '<div class="fila">' +
        '<div style="flex:1">' +
          '<h2>' + esc(a.alumno_nombre) + '</h2>' +
          '<div class="sub"><span class="nivel n-' + esc(a.nivel) + '">' + esc(a.nivel) +
            '</span> ' + esc(a.grado_solicitado || '—') +
            ' · Ciclo ' + esc(a.anio_vacante || '—') + ' · <code>' + esc(a.id) + '</code></div>' +
        '</div>' +
        '<span class="estado e-' + esc(a.estado) + '">' + esc(nombreEstado(a.estado)) + '</span>' +
        '<button class="cerrar" onclick="cerrarPanel()" title="Cerrar">' + ICO.cerrar + '</button>' +
      '</div>' +
    '</div>' +

    '<div class="panel-cuerpo">' +
      '<div id="avisoPanel"></div>' +

      '<div class="seccion">' +
        '<h3>Recorrido de la admisión</h3>' +
        '<div class="bloque">' + pintarPasos(a) + '</div>' +
      '</div>' +

      '<div class="seccion">' +
        '<h3>Acciones</h3>' +
        '<div class="botonera">' +
          '<button class="primario" id="bMail">Enviar mail</button>' +
          '<button id="bNota">Agregar nota</button>' +
          '<button id="bFicha">Generar ficha</button>' +
          (a.pdf_url ? '<button onclick="window.open(\'' + esc(a.pdf_url) + '\',\'_blank\')">Ver ficha</button>' : '') +
        '</div>' +
      '</div>' +

      '<div class="seccion">' +
        '<h3>Datos</h3>' +
        '<div class="bloque"><div class="campos">' +
          campo('Alumno/a', 'alumno_nombre', a.alumno_nombre) +
          campo('Nacimiento', 'alumno_fecha_nac', a.alumno_fecha_nac) +
          campo('DNI', 'alumno_dni', a.alumno_dni) +
          campo('Solicita', 'grado_solicitado', a.grado_solicitado) +
          campo('Actualmente', 'grado_actual', a.grado_actual) +
          campo('Escuela actual', 'escuela_actual', a.escuela_actual) +
          campo('Familia', 'tutor1_nombre', a.tutor1_nombre) +
          campo('Familia 2', 'tutor2_nombre', a.tutor2_nombre) +
          campo('Celular', 'celular', a.celular) +
          campo('Mail', 'email', a.email, 'email') +
          '<div class="campo"><label>Inclusión</label><select data-campo="inclusion_solicitada">' +
            '<option value=""' + (valorInc === '' ? ' selected' : '') + '>Sin definir</option>' +
            '<option value="si"' + (valorInc === 'si' ? ' selected' : '') + '>Sí</option>' +
            '<option value="no"' + (valorInc === 'no' ? ' selected' : '') + '>No</option>' +
          '</select></div>' +
          campo('Responsable', 'responsable', a.responsable) +
        '</div>' +
        '<div style="margin-top:12px"><button id="bGuardar">Guardar datos</button></div>' +
        '</div>' +
      '</div>' +

      '<div class="seccion">' +
        '<h3>Recorrido</h3>' +
        pintarRecorrido(eventos) +
      '</div>' +
    '</div>';

  Array.prototype.forEach.call(document.querySelectorAll('#panel [data-ir-a]'), function (b) {
    b.onclick = function () {
      accion('cambiarEstado', { id: a.id, estado: b.dataset.irA },
        a.id, 'Marcado como ' + nombreEstado(b.dataset.irA));
    };
  });

  document.getElementById('bGuardar').onclick = function () {
    var cambios = {};
    Array.prototype.forEach.call(document.querySelectorAll('#panel [data-campo]'), function (el) {
      var v = el.value;
      if (el.dataset.campo === 'inclusion_solicitada') {
        if (v === '') return;
        v = (v === 'si');
      }
      cambios[el.dataset.campo] = v;
    });
    accion('actualizar', { id: a.id, cambios: cambios }, a.id, 'Datos guardados');
  };

  document.getElementById('bMail').onclick = function () { abrirMail(a.id); };

  document.getElementById('bNota').onclick = function () {
    var t = prompt('Nota interna:');
    if (t) accion('agregarNota', { id: a.id, texto: t }, a.id, 'Nota agregada');
  };

  document.getElementById('bFicha').onclick = function () {
    var b = document.getElementById('bFicha');
    b.disabled = true; b.textContent = 'Generando…';
    api('generarFicha', { id: a.id }).then(function (r) {
      if (!r.ok) {
        document.getElementById('avisoPanel').innerHTML = aviso(r.error, 'mal');
        b.disabled = false; b.textContent = 'Generar ficha';
        return;
      }
      abrirPanel(a.id);
      flotante('Ficha generada');
      window.open(r.resultado.url, '_blank');
    });
  };
}

/**
 * Checkpoints del recorrido.
 *
 * Los estados con orden hasta 60 son el camino normal y se dibujan como
 * pasos; los de 70 en adelante son desvíos (lista de espera, sin vacante,
 * desistió) y van aparte, porque no forman una secuencia.
 *
 * Todo lo anterior al estado actual se pinta como cumplido, así se ve de un
 * vistazo dónde está la familia sin tener que leer el historial.
 */
var ORDEN_MAXIMO_FLUJO = 60;

function pintarPasos(a) {
  var flujo = estados.filter(function (e) { return Number(e.orden) <= ORDEN_MAXIMO_FLUJO; });
  var ramas = estados.filter(function (e) { return Number(e.orden) > ORDEN_MAXIMO_FLUJO; });

  var actual = -1;
  flujo.forEach(function (e, i) { if (e.id === a.estado) actual = i; });

  var tick = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5"><path d="m20 6-11 11-5-5"/></svg>';

  var pasos = flujo.map(function (e, i) {
    var clase = i < actual ? 'hecho' : (i === actual ? 'actual' : '');
    return '<button class="paso ' + clase + '" data-ir-a="' + esc(e.id) + '" ' +
      'title="Marcar como ' + esc(e.nombre) + '">' +
      '<span class="bolita">' + tick + '</span>' +
      '<span class="rotulo">' + esc(e.nombre) + '</span>' +
    '</button>';
  }).join('');

  var desvios = ramas.map(function (e) {
    return '<button class="rama ' + (e.id === a.estado ? 'activa-' + esc(e.id) : '') + '" ' +
      'data-ir-a="' + esc(e.id) + '">' + esc(e.nombre) + '</button>';
  }).join('');

  return '<div class="pasos">' + pasos + '</div>' +
    (desvios ? '<div class="ramas">' + desvios + '</div>' : '');
}

var NOMBRE_EVENTO = {
  alta: 'Alta desde el formulario', mail_enviado: 'Mail enviado',
  mail_recibido: 'Respuesta de la familia', llamada: 'Llamada telefónica',
  cambio_estado: 'Cambio de estado', nota: 'Nota interna', pdf_generado: 'Ficha generada'
};

function pintarRecorrido(eventos) {
  if (!eventos.length) {
    return '<div class="bloque" style="text-align:center;color:var(--texto-suave);padding:24px">' +
      'Todavía no hay movimientos.</div>';
  }
  return '<div class="recorrido">' + eventos.map(function (e) {
    return '<div class="hito ' + esc(e.tipo) + '">' +
      '<div class="cuando">' + esc(fecha(e.timestamp)) + ' · ' + esc(e.usuario) + '</div>' +
      '<div class="titulo">' + esc(NOMBRE_EVENTO[e.tipo] || e.tipo) +
        (e.asunto ? ' — ' + esc(e.asunto) : '') + '</div>' +
      (e.detalle ? '<div class="detalle">' + esc(e.detalle) + '</div>' : '') +
    '</div>';
  }).join('') + '</div>';
}

function accion(nombre, params, idRecargar, mensaje) {
  api(nombre, params).then(function (r) {
    if (!r.ok) {
      document.getElementById('avisoPanel').innerHTML = aviso(r.error, 'mal');
      return;
    }
    abrirPanel(idRecargar);
    cargar();
    if (mensaje) flotante(mensaje);
  });
}

/* ─── Mail ─── */

function cerrarModal() {
  document.getElementById('modal').classList.remove('visible');
  document.getElementById('modal').innerHTML = '';
}

function abrirMail(id, idPlantilla) {
  var m = document.getElementById('modal');
  m.classList.add('visible');
  m.innerHTML = '<div class="modal-caja"><div class="modal-cuerpo">' +
    '<div class="esqueleto"></div></div></div>';

  api('previsualizarMail', { id: id, idPlantilla: idPlantilla }).then(function (r) {
    var p = r.ok ? r.previsualizacion : null;

    if (!r.ok || !p.ok) {
      m.innerHTML = '<div class="modal-caja">' +
        '<div class="modal-cabeza"><h2>Enviar mail</h2>' +
        '<button class="cerrar" onclick="cerrarModal()">' + ICO.cerrar + '</button></div>' +
        '<div class="modal-cuerpo">' + aviso(r.error || p.motivo, 'avisa') + '</div>' +
        '<div class="modal-pie"><button onclick="cerrarModal()">Cerrar</button></div></div>';
      return;
    }

    var opciones = p.disponibles.map(function (d) {
      return '<option value="' + esc(d.id) + '"' + (d.id === p.plantilla.id ? ' selected' : '') + '>' +
        esc(d.nombre) + '</option>';
    }).join('');

    m.innerHTML = '<div class="modal-caja">' +
      '<div class="modal-cabeza"><h2>Enviar mail</h2>' +
        '<button class="cerrar" onclick="cerrarModal()">' + ICO.cerrar + '</button></div>' +

      '<div class="modal-cuerpo">' +
        '<dl class="sobre">' +
          '<div class="linea"><dt>De</dt><dd>' + esc(p.de) + '</dd></div>' +
          '<div class="linea"><dt>Para</dt><dd>' + esc(p.para) + '</dd></div>' +
          (p.copias.length ? '<div class="linea"><dt>Copia</dt><dd>' + esc(p.copias.join(', ')) + '</dd></div>' : '') +
          '<div class="linea"><dt>Responden a</dt><dd>' + esc(p.responderA.join(', ')) + '</dd></div>' +
        '</dl>' +

        (p.faltantes.length
          ? aviso('Faltan datos: ' + p.faltantes.join(', ') +
                  '. Completalos en la ficha o editá el texto antes de enviar.', 'mal')
          : '') +

        '<div id="avisoMail"></div>' +

        '<label class="etiqueta" for="selPlantilla">Plantilla</label>' +
        '<select class="ancho" id="selPlantilla">' + opciones + '</select>' +

        '<label class="etiqueta" for="asunto">Asunto</label>' +
        '<input class="ancho" id="asunto" value="' + esc(p.asunto) + '">' +

        '<label class="etiqueta" for="cuerpo">Mensaje</label>' +
        '<textarea class="ancho" id="cuerpo">' + esc(p.cuerpo) + '</textarea>' +
      '</div>' +

      '<div class="modal-pie">' +
        '<button onclick="cerrarModal()">Cancelar</button>' +
        '<button class="primario" id="bEnviar">Enviar</button>' +
      '</div></div>';

    document.getElementById('selPlantilla').onchange = function () { abrirMail(id, this.value); };

    document.getElementById('bEnviar').onclick = function () {
      var b = document.getElementById('bEnviar');
      b.disabled = true; b.textContent = 'Enviando…';

      api('enviarMail', {
        id: id,
        idPlantilla: document.getElementById('selPlantilla').value,
        asunto: document.getElementById('asunto').value,
        cuerpo: document.getElementById('cuerpo').value
      }).then(function (r) {
        if (!r.ok || !r.resultado.ok) {
          document.getElementById('avisoMail').innerHTML = aviso(r.error || r.resultado.motivo, 'mal');
          b.disabled = false; b.textContent = 'Enviar';
          return;
        }
        cerrarModal();
        abrirPanel(id);
        cargar();
        flotante('Mail enviado' + (r.resultado.copias.length ? ' · copia a ' + r.resultado.copias.join(', ') : ''));
      });
    };
  });
}

/* ─── Plantillas ─── */

function abrirPlantillas() {
  var m = document.getElementById('modal');
  m.classList.add('visible');
  m.innerHTML = '<div class="modal-caja"><div class="modal-cuerpo"><div class="esqueleto"></div></div></div>';

  api('plantillas').then(function (r) {
    if (!r.ok) {
      m.innerHTML = '<div class="modal-caja"><div class="modal-cuerpo">' + aviso(r.error, 'mal') +
        '</div><div class="modal-pie"><button onclick="cerrarModal()">Cerrar</button></div></div>';
      return;
    }
    plantillasCache = r;

    var filas = r.plantillas.map(function (p) {
      return '<article class="tarjeta" data-id="' + esc(p.id) + '" style="margin-bottom:8px">' +
        '<div class="principal">' +
          '<div class="nombre">' + esc(p.nombre) + '<span class="nivel">' + esc(p.nivel) + '</span></div>' +
          '<div class="meta">Se usa cuando: <code>' + esc(p.condicion) + '</code></div>' +
        '</div></article>';
    }).join('');

    m.innerHTML = '<div class="modal-caja">' +
      '<div class="modal-cabeza"><h2>Plantillas de mail</h2>' +
        '<button class="cerrar" onclick="cerrarModal()">' + ICO.cerrar + '</button></div>' +
      '<div class="modal-cuerpo">' +
        '<p style="color:var(--texto-suave);font-size:13px;margin-bottom:14px">' +
          'Los textos se editan acá, sin tocar código. Usá ' +
          r.campos.slice(0, 4).map(function (c) { return '<code>{{' + esc(c) + '}}</code>'; }).join(' ') +
          ' y demás para insertar los datos de cada familia.</p>' +
        filas +
      '</div></div>';

    Array.prototype.forEach.call(m.querySelectorAll('.tarjeta'), function (t) {
      t.onclick = function () {
        editarPlantilla(r.plantillas.filter(function (x) { return x.id === t.dataset.id; })[0], r.campos);
      };
    });
  });
}

function editarPlantilla(p, campos) {
  document.getElementById('modal').innerHTML = '<div class="modal-caja">' +
    '<div class="modal-cabeza"><h2>' + esc(p.nombre) + '</h2>' +
      '<button class="cerrar" onclick="cerrarModal()">' + ICO.cerrar + '</button></div>' +

    '<div class="modal-cuerpo">' +
      '<p style="color:var(--texto-suave);font-size:12.5px">Campos disponibles: ' +
        campos.map(function (c) { return '<code>{{' + esc(c) + '}}</code>'; }).join(' ') + '</p>' +

      '<div id="avisoPlantilla" style="margin-top:12px"></div>' +

      '<label class="etiqueta" for="pCond">Se usa cuando</label>' +
      '<input class="ancho" id="pCond" value="' + esc(p.condicion) + '">' +
      '<p style="color:var(--texto-suave);font-size:12px;margin-top:5px">' +
        '<code>*</code> para la plantilla por defecto, o <code>campo operador valor</code> — ' +
        'por ejemplo <code>anio_vacante &gt;= 2028</code>.</p>' +

      '<label class="etiqueta" for="pAsunto">Asunto</label>' +
      '<input class="ancho" id="pAsunto" value="' + esc(p.asunto) + '">' +

      '<label class="etiqueta" for="pCuerpo">Mensaje</label>' +
      '<textarea class="ancho" id="pCuerpo">' + esc(p.cuerpo) + '</textarea>' +
    '</div>' +

    '<div class="modal-pie">' +
      '<button onclick="abrirPlantillas()">Volver</button>' +
      '<button class="primario" id="bGuardarP">Guardar</button>' +
    '</div></div>';

  document.getElementById('bGuardarP').onclick = function () {
    api('guardarPlantilla', {
      plantilla: {
        id: p.id, nivel: p.nivel, nombre: p.nombre, prioridad: p.prioridad, activa: p.activa,
        condicion: document.getElementById('pCond').value,
        asunto: document.getElementById('pAsunto').value,
        cuerpo: document.getElementById('pCuerpo').value
      }
    }).then(function (r) {
      if (!r.ok) {
        document.getElementById('avisoPlantilla').innerHTML = aviso(r.error, 'mal');
        return;
      }
      cerrarModal();
      flotante('Plantilla guardada');
    });
  };
}

/* ─── Eventos globales ─── */

var tecleo;
document.getElementById('buscar').oninput = function () {
  filtros.texto = this.value.trim();
  clearTimeout(tecleo);
  tecleo = setTimeout(cargar, 320);
};

document.getElementById('btnPlantillas').onclick = abrirPlantillas;
document.getElementById('velo').onclick = cerrarPanel;

document.getElementById('modal').onclick = function (ev) {
  if (ev.target === this) cerrarModal();
};

document.addEventListener('keydown', function (ev) {
  if (ev.key !== 'Escape') return;
  if (document.getElementById('modal').classList.contains('visible')) cerrarModal();
  else cerrarPanel();
});

document.getElementById('btnImportar').onclick = function () {
  var b = this;
  b.disabled = true; b.textContent = 'Importando…';
  api('importar').then(function (r) {
    b.disabled = false; b.textContent = 'Importar del sitio';
    if (!r.ok) { flotante('Error: ' + r.error); return; }
    flotante(r.resumen.importadas + ' nuevas · ' + r.resumen.salteadas + ' ya estaban');
    cargar();
  });
};

/* ─── Login ─── */

function entrar(respuesta) {
  idToken = respuesta.credential;
  arrancar();
}

if (enAppsScript) {
  arrancar();
} else {
  document.getElementById('login').classList.add('visible');

  if (!URL_API || !CLIENT_ID) {
    document.getElementById('errorLogin').innerHTML =
      aviso('Falta completar URL_API y CLIENT_ID en index.html. Ver docs/sitio.md.', 'mal');
  } else {
    var s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true;
    s.onload = function () {
      google.accounts.id.initialize({
        client_id: CLIENT_ID, callback: entrar, hd: 'sancarlos.edu.ar'
      });
      google.accounts.id.renderButton(document.getElementById('botonGoogle'), {
        theme: 'outline', size: 'large', text: 'signin_with', locale: 'es', width: 300
      });
    };
    document.head.appendChild(s);
  }
}
</script>
</body>
</html>
