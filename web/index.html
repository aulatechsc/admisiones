<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admisiones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --marca: #00476c;
  --marca-alta: #0a5e8a;
  --marca-suave: #eaf4fa;

  --fondo: #f5f7f9;
  --superficie: #ffffff;
  --superficie-alta: #fbfcfd;
  --linea: #e3e8ee;
  --linea-fuerte: #cfd8e3;

  --texto: #111a24;
  --texto-medio: #4a5765;
  --texto-suave: #78838f;

  --azul: #0969da;   --azul-bg: #ddf0ff;
  --cyan: #0e7490;   --cyan-bg: #d9f2f7;
  --ambar: #9a6700;  --ambar-bg: #fff3d4;
  --violeta: #6639ba;--violeta-bg: #ece4fb;
  --verde: #1a7f37;  --verde-bg: #d7f5df;
  --rojo: #b02020;   --rojo-bg: #ffe2e0;
  --gris: #57606a;   --gris-bg: #eceff2;

  --sombra-1: 0 1px 2px rgba(16,24,40,.05);
  --sombra-2: 0 4px 12px rgba(16,24,40,.08);
  --sombra-3: 0 16px 40px rgba(16,24,40,.16);

  --r-s: 6px; --r-m: 10px; --r-l: 14px;
  --transicion: 140ms cubic-bezier(.4,0,.2,1);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --marca: #6cb6dd; --marca-alta: #8fc9e8; --marca-suave: #10283a;
    --fondo: #0d1117; --superficie: #151b23; --superficie-alta: #1b222c;
    --linea: #242c38; --linea-fuerte: #333d4b;
    --texto: #e6edf3; --texto-medio: #a8b3c1; --texto-suave: #7d8894;
    --azul: #6cb6ff;   --azul-bg: #0f2b47;
    --cyan: #56d4dd;   --cyan-bg: #0c2f35;
    --ambar: #e3b341;  --ambar-bg: #3a2c0c;
    --violeta: #bc8cff;  --violeta-bg: #2a1f45;
    --verde: #3fb950;  --verde-bg: #0f2f18;
    --rojo: #f85149;   --rojo-bg: #3d1618;
    --gris: #8b949e;   --gris-bg: #21262d;
    --sombra-1: 0 1px 2px rgba(0,0,0,.3);
    --sombra-2: 0 4px 12px rgba(0,0,0,.4);
    --sombra-3: 0 16px 40px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"] {
  --marca: #6cb6dd; --marca-alta: #8fc9e8; --marca-suave: #10283a;
  --fondo: #0d1117; --superficie: #151b23; --superficie-alta: #1b222c;
  --linea: #242c38; --linea-fuerte: #333d4b;
  --texto: #e6edf3; --texto-medio: #a8b3c1; --texto-suave: #7d8894;
  --azul: #6cb6ff;   --azul-bg: #0f2b47;
  --cyan: #56d4dd;   --cyan-bg: #0c2f35;
  --ambar: #e3b341;  --ambar-bg: #3a2c0c;
  --violeta: #bc8cff;--violeta-bg: #2a1f45;
  --verde: #3fb950;  --verde-bg: #0f2f18;
  --rojo: #f85149;   --rojo-bg: #3d1618;
  --gris: #8b949e;   --gris-bg: #21262d;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--fondo);
  color: var(--texto);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

/* ─── Barra superior ─── */
.topbar {
  position: sticky; top: 0; z-index: 30;
  background: var(--superficie);
  border-bottom: 1px solid var(--linea);
  padding: 0 20px;
  height: 60px;
  display: flex; align-items: center; gap: 16px;
}
.marca { display: flex; align-items: center; gap: 9px; font-weight: 650; font-size: 15px; letter-spacing: -.01em; }
.marca svg { width: 22px; height: 22px; color: var(--marca); flex: none; }
.marca span { color: var(--texto-suave); font-weight: 400; }

.marca .version {
  font-size: 10.5px; font-weight: 500; color: var(--texto-suave);
  border: 1px solid var(--linea); border-radius: 999px;
  padding: 1px 7px; margin-left: 2px; letter-spacing: .2px;
}

.buscador { position: relative; flex: 1; max-width: 420px; margin-left: 8px; }
.buscador svg {
  position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
  width: 15px; height: 15px; color: var(--texto-suave); pointer-events: none;
}
.buscador input {
  width: 100%; padding: 8px 12px 8px 33px;
  border: 1px solid var(--linea-fuerte); border-radius: var(--r-m);
  background: var(--superficie-alta); color: var(--texto);
  font: inherit; transition: var(--transicion);
}
.buscador input:focus {
  outline: none; border-color: var(--marca);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--marca) 15%, transparent);
  background: var(--superficie);
}
.buscador input::placeholder { color: var(--texto-suave); }

.usuario { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.usuario .datos { text-align: right; line-height: 1.3; }
.usuario .datos b { display: block; font-size: 13px; font-weight: 550; }
.usuario .datos small { color: var(--texto-suave); font-size: 11.5px; }
.icono-solo {
  width: 32px; height: 32px; padding: 0; border-radius: var(--r-m);
  display: grid; place-items: center;
  border: 1px solid var(--linea-fuerte); background: var(--superficie);
  color: var(--texto-medio);
}
.icono-solo svg { width: 16px; height: 16px; }
.icono-solo:hover { color: var(--marca); border-color: var(--marca); }

.avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--marca); color: #fff;
  display: grid; place-items: center;
  font-size: 12.5px; font-weight: 600; flex: none;
}

/* ─── Contenido ─── */
main { max-width: 1160px; margin: 0 auto; padding: 22px 20px 60px; }

.controles { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
.resumen { color: var(--texto-suave); font-size: 13px; }
.resumen b { color: var(--texto); font-weight: 600; }
.acciones-barra { margin-left: auto; display: flex; gap: 8px; }

/* ─── Días de espera ─── */
.espera {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 12px; font-weight: 550; white-space: nowrap;
  padding: 3px 9px; border-radius: 999px;
}
.espera svg { width: 12px; height: 12px; }
.espera.tranquilo { background: var(--gris-bg);   color: var(--gris); }
.espera.atencion  { background: var(--ambar-bg);  color: var(--ambar); }
.espera.urgente   { background: var(--rojo-bg);   color: var(--rojo); }
.espera.nuestra   { background: var(--violeta-bg);color: var(--violeta); }

/* ─── Checkpoints del recorrido ─── */
.pasos { display: flex; align-items: flex-start; gap: 0; overflow-x: auto; padding: 4px 0 2px; }
.paso {
  flex: 1; min-width: 78px; background: none; border: none; padding: 0;
  cursor: pointer; text-align: center; position: relative;
  font: inherit; color: var(--texto-suave); transition: var(--transicion);
}
.paso::before {
  content: ''; position: absolute; top: 10px; left: -50%; width: 100%;
  height: 2px; background: var(--linea); z-index: 0;
}
.paso:first-child::before { display: none; }
.paso .bolita {
  position: relative; z-index: 1; margin: 0 auto 6px;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--superficie); border: 2px solid var(--linea-fuerte);
  display: grid; place-items: center; transition: var(--transicion);
}
.paso .bolita svg { width: 11px; height: 11px; opacity: 0; transition: var(--transicion); }
.paso .rotulo { font-size: 11px; line-height: 1.25; font-weight: 500; padding: 0 3px; display: block; }

.paso.hecho::before { background: var(--verde); }
.paso.hecho .bolita { background: var(--verde); border-color: var(--verde); color: #fff; }
.paso.hecho .bolita svg { opacity: 1; }
.paso.hecho .rotulo { color: var(--texto-medio); }

.paso.actual .bolita {
  background: var(--marca); border-color: var(--marca); color: #fff;
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--marca) 20%, transparent);
  transform: scale(1.12);
}
.paso.actual .rotulo { color: var(--texto); font-weight: 650; }

.paso:hover:not(.actual) .bolita { border-color: var(--marca); }
.paso:hover .rotulo { color: var(--texto); }

.ramas { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 14px; padding-top: 13px; border-top: 1px solid var(--linea); }
.rama {
  padding: 5px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 500;
  border: 1px solid var(--linea-fuerte); background: var(--superficie);
  color: var(--texto-medio); cursor: pointer; transition: var(--transicion);
}
.rama:hover { border-color: var(--texto-suave); color: var(--texto); }
.rama.activa-lista_espera { background: var(--gris-bg); color: var(--gris); border-color: var(--gris); font-weight: 650; }
.rama.activa-sin_vacante  { background: var(--rojo-bg); color: var(--rojo); border-color: var(--rojo); font-weight: 650; }
.rama.activa-desistio     { background: var(--gris-bg); color: var(--gris); border-color: var(--gris); font-weight: 650; }

button, select {
  font: inherit; color: var(--texto);
  border: 1px solid var(--linea-fuerte); border-radius: var(--r-m);
  background: var(--superficie); padding: 7px 13px;
  cursor: pointer; transition: var(--transicion); font-weight: 500;
}
button:hover:not(:disabled) { background: var(--superficie-alta); border-color: var(--texto-suave); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primario {
  background: var(--marca); border-color: var(--marca); color: #fff; font-weight: 550;
}
:root[data-theme="dark"] button.primario,
html:not([data-theme="light"]) button.primario { color: #0d1117; }
button.primario:hover:not(:disabled) { background: var(--marca-alta); border-color: var(--marca-alta); }
button.sutil { border-color: transparent; background: transparent; color: var(--texto-medio); }
button.sutil:hover:not(:disabled) { background: var(--gris-bg); border-color: transparent; }

/* ─── Tarjetas ─── */
.grilla { display: grid; gap: 9px; }
.tarjeta {
  background: var(--superficie); border: 1px solid var(--linea);
  border-radius: var(--r-l); padding: 12px 15px;
  cursor: pointer; transition: var(--transicion);
  display: block; box-shadow: var(--sombra-1);
}
/* Rejilla y no flex: con flex el nombre se queda con el espacio libre y el
   recorrido queda pegado a él. Las dos columnas de los costados miden igual,
   así que el recorrido cae justo en el medio. */
.tarjeta .arriba { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 16px; }
.tarjeta .medio { display: flex; align-items: flex-start; }
/* Un renglón por dato: el nombre entero no entra al lado del recorrido, y
   partido en dos deja cada tarjeta de un alto distinto. */
.tarjeta .nombre, .tarjeta .sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tarjeta .sub { font-size: 13px; color: var(--texto-suave); margin-top: 1px; }
.tarjeta .derecha { display: flex; align-items: center; gap: 7px; justify-self: end; }
.tarjeta:hover {
  box-shadow: var(--sombra-2);
  transform: translateY(-1px);
}
.tarjeta .principal { flex: 1; min-width: 0; }
.tarjeta .nombre {
  font-size: 15px; font-weight: 600; letter-spacing: -.01em;
  display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
}
.tarjeta .meta {
  color: var(--texto-suave); font-size: 12.5px; margin-top: 2px;
  display: flex; gap: 7px; flex-wrap: wrap; align-items: center;
}
.tarjeta .meta .punto { opacity: .45; }

.nivel {
  font-size: 10.5px; font-weight: 650; text-transform: uppercase;
  letter-spacing: .05em; padding: 2px 7px; border-radius: var(--r-s);
  background: var(--gris-bg); color: var(--gris);
}
/* El nivel va en gris: cada persona ve sólo el suyo, así que colorearlo no
   agrega información. El color se reserva para la situación, que es lo que
   hay que poder leer de un vistazo. */
.nivel.n-Inicial, .nivel.n-Primaria, .nivel.n-Secundaria {
  background: var(--gris-bg); color: var(--gris);
}

/* La situación de cada familia se lee de lejos, sin leer una palabra:
     verde    matriculada
     amarillo en proceso — contactada, entrevistas, visita
     rojo     sin contactar, o demasiados días sin movimiento
     gris     cerrada sin matrícula

   Pinta la franja, el fondo y el borde. El fondo va en porcentaje sobre la
   superficie y no con un color fijo, para que el mismo número sirva en claro
   y en oscuro: mezclar 8% de rojo sobre blanco da un rosa muy suave, y sobre
   el gris oscuro del tema nocturno da un bordó apenas insinuado. Más que eso
   y el texto empieza a perder contraste. */
.tarjeta { border-left-width: 5px; }

.tarjeta.s-verde {
  border-color: color-mix(in srgb, var(--verde) 28%, var(--linea));
  border-left-color: var(--verde);
  background: color-mix(in srgb, var(--verde) 8%, var(--superficie));
}
.tarjeta.s-amarillo {
  border-color: color-mix(in srgb, var(--ambar) 30%, var(--linea));
  border-left-color: var(--ambar);
  background: color-mix(in srgb, var(--ambar) 9%, var(--superficie));
}
.tarjeta.s-rojo {
  border-color: color-mix(in srgb, var(--rojo) 28%, var(--linea));
  border-left-color: var(--rojo);
  background: color-mix(in srgb, var(--rojo) 8%, var(--superficie));
}
.tarjeta.s-gris {
  border-left-color: var(--linea-fuerte);
  background: var(--superficie);
}
.tarjeta.s-gris:hover { border-color: var(--linea-fuerte); }

/* En hover sube un punto, no se apaga: si no, pasar el mouse por la lista
   hace parpadear los colores y se pierde la lectura de conjunto. */
.tarjeta.s-verde:hover    { background: color-mix(in srgb, var(--verde) 13%, var(--superficie)); }
.tarjeta.s-amarillo:hover { background: color-mix(in srgb, var(--ambar) 14%, var(--superficie)); }
.tarjeta.s-rojo:hover     { background: color-mix(in srgb, var(--rojo) 13%, var(--superficie)); }

/* La línea que separa el recorrido cuando baja a su propia fila tiene que
   seguir viéndose sobre el fondo pintado. */
.tarjeta.s-verde .medio    { border-top-color: color-mix(in srgb, var(--verde) 30%, transparent); }
.tarjeta.s-amarillo .medio { border-top-color: color-mix(in srgb, var(--ambar) 32%, transparent); }
.tarjeta.s-rojo .medio     { border-top-color: color-mix(in srgb, var(--rojo) 30%, transparent); }

/* El recorrido va al medio de la tarjeta, con los mismos rótulos y el mismo
   tilde que en el panel — es el mismo componente, sólo que más chico. */
.pasos.chico { padding: 0; }
.pasos.chico .paso { flex: 0 0 74px; min-width: 0; }
.pasos.chico .paso::before { top: 8px; }
.pasos.chico .bolita { width: 18px; height: 18px; margin-bottom: 4px; }
.pasos.chico .bolita svg { width: 9px; height: 9px; }
.pasos.chico .rotulo { font-size: 10px; padding: 0 2px; }
.pasos.chico .paso.actual .bolita { box-shadow: 0 0 0 3px color-mix(in srgb, var(--marca) 20%, transparent); }

/* Los desvíos no entran como pastillas en cada fila: un bloque de tres por
   tarjeta duplica el alto del dashboard entero. Van detrás de este botón,
   que igual muestra el nombre y el color cuando la admisión está en uno. */
.rama-chip {
  flex: none; flex: none; padding: 3px 10px; border-radius: 999px;
  border: 1px solid var(--linea-fuerte); background: var(--superficie);
  color: var(--texto-suave); font-size: 12px; font-weight: 600; line-height: 1.5;
}
.rama-chip:hover { color: var(--marca); border-color: var(--marca); }
.rama-chip.activa-lista_espera { background: var(--gris-bg); color: var(--gris); border-color: var(--gris); }
.rama-chip.activa-sin_vacante  { background: var(--rojo-bg); color: var(--rojo); border-color: var(--rojo); }
.rama-chip.activa-desistio     { background: var(--gris-bg); color: var(--gris); border-color: var(--gris); }

/* Confirmación al tocar un paso: el destino y la nota, en el mismo lugar */
.popover {
  position: absolute; z-index: 70; width: 260px;
  background: var(--superficie); border: 1px solid var(--linea-fuerte);
  border-radius: var(--r-l); box-shadow: var(--sombra-3); padding: 12px;
}
.popover .destino { font-size: 13.5px; font-weight: 600; margin-bottom: 9px; }
.popover .destino small { display: block; font-weight: 400; color: var(--texto-suave); font-size: 12px; }
.popover input {
  width: 100%; padding: 7px 9px; font: inherit; font-size: 13px;
  border: 1px solid var(--linea-fuerte); border-radius: var(--r-s);
  background: var(--superficie-alta); color: var(--texto); margin-bottom: 9px;
}
.popover .botones { display: flex; gap: 7px; }
.popover .botones button { flex: 1; padding: 6px 10px; font-size: 13px; }

/* Acciones desde la lista, sin abrir la ficha */
.acciones-fila { display: flex; gap: 5px; flex: none; }
.acciones-fila button {
  width: 30px; height: 30px; padding: 0;
  display: grid; place-items: center; border-radius: var(--r-s);
  border: 1px solid var(--linea-fuerte); background: var(--superficie);
  color: var(--texto-medio);
}
.acciones-fila button svg { width: 15px; height: 15px; }
.acciones-fila button:hover { color: var(--marca); border-color: var(--marca); }
.acciones-fila .apagado { border-style: dashed; color: var(--texto-suave); opacity: .4; cursor: default; }
.acciones-fila .apagado:hover { color: var(--texto-suave); border-color: var(--linea-fuerte); }

/* Menú de estado anclado a la tarjeta */
.menu-estado {
  position: absolute; z-index: 70; min-width: 250px;
  background: var(--superficie); border: 1px solid var(--linea-fuerte);
  border-radius: var(--r-l); box-shadow: var(--sombra-3); padding: 7px;
}
.menu-estado .opcion {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 7px 9px; border: none; background: none; border-radius: var(--r-s);
  font: inherit; font-size: 13.5px; color: var(--texto); cursor: pointer; text-align: left;
}
.menu-estado .opcion:hover { background: var(--marca-suave); }
.menu-estado .opcion .bolita-estado {
  width: 9px; height: 9px; border-radius: 50%; flex: none; background: currentColor;
}
.menu-estado .opcion.actual { font-weight: 650; }
.menu-estado .separador { height: 1px; background: var(--linea); margin: 5px 3px; }
.menu-estado .nota {
  width: 100%; margin: 4px 0 6px; padding: 7px 9px; font: inherit; font-size: 13px;
  border: 1px solid var(--linea-fuerte); border-radius: var(--r-s);
  background: var(--superficie-alta); color: var(--texto);
}
.menu-estado .ayuda {
  font-size: 11.5px; color: var(--texto-suave); padding: 2px 4px 6px;
}

.estado {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 11px; border-radius: 999px;
  font-size: 12px; font-weight: 550; white-space: nowrap;
}
.estado::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.e-nueva               { background: var(--azul-bg);    color: var(--azul); }
.e-contactada          { background: var(--cyan-bg);    color: var(--cyan); }
.e-entrevista_agendada { background: var(--ambar-bg);   color: var(--ambar); }
.e-entrevista_hecha    { background: var(--ambar-bg);   color: var(--ambar); }
.e-visita              { background: var(--violeta-bg); color: var(--violeta); }
.e-matriculada         { background: var(--verde-bg);   color: var(--verde); }
.e-lista_espera        { background: var(--gris-bg);    color: var(--gris); }
.e-sin_vacante         { background: var(--rojo-bg);    color: var(--rojo); }
.e-desistio            { background: var(--gris-bg);    color: var(--gris); }

.marca-inclusion {
  font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: var(--r-s);
  background: var(--violeta-bg); color: var(--violeta);
}

/* Acceso directo a la ficha desde la lista */
.ficha-rapida {
  flex: none; width: 30px; height: 30px; padding: 0;
  display: grid; place-items: center; border-radius: var(--r-s);
  border: 1px solid var(--linea-fuerte); background: var(--superficie);
  color: var(--texto-medio);
}
.ficha-rapida svg { width: 15px; height: 15px; }
.ficha-rapida:hover { color: var(--marca); border-color: var(--marca); }

/* ─── Panel lateral ─── */

.hito { position: relative; }

/* ─── Modal (mail / plantillas) ─── */
.modal {
  position: fixed; inset: 0; z-index: 60; display: none;

  opacity: 0; transition: all 260ms cubic-bezier(.32,.72,0,1); pointer-events: none;
}
.flotante.visible { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ─── Vacíos y carga ─── */
.vacio { text-align: center; padding: 70px 20px; color: var(--texto-suave); }

.esqueleto { background: var(--superficie); border: 1px solid var(--linea); border-radius: var(--r-l); height: 68px; margin-bottom: 9px; overflow: hidden; position: relative; }

/* ─── Login ─── */

code {

  }
}

<script>
/* ───────────────────────────────────────────────────────────
   Transporte

   El mismo archivo anda servido por Apps Script y desde Vercel.
   Bajo Apps Script existe google.script.run y Google ya autenticó.
   Desde afuera se manda el ID token de Google en cada llamada.

   El Content-Type es text/plain a propósito: así el navegador lo
   trata como "simple request" y no dispara el preflight OPTIONS,
   que las web apps de Apps Script no contestan.
   ─────────────────────────────────────────────────────────── */

var URL_API = '';    // URL de la web app (/exec) — sólo para Vercel
var CLIENT_ID = '';  // Client ID de OAuth       — sólo para Vercel

var idToken = null;
var enAppsScript = typeof google !== 'undefined' && google.script && google.script.run;

function api(accion, params) {
  if (enAppsScript) {
    return new Promise(function (ok, mal) {
      google.script.run
        .withSuccessHandler(ok)
        .withFailureHandler(function (e) { mal(new Error(e.message || e)); })
        .llamar(accion, params || {});
    });
  }
  return fetch(URL_API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ accion: accion, params: params || {}, id_token: idToken })
  }).then(function (r) { return r.json(); });
}

/* ─── Estado ─── */

var sesion = null, estados = [], admisiones = [], plantillasCache = null;
var filtros = { texto: '', estado: '', anio: '' };

function esc(t) {
  return (t === null || t === undefined ? '' : String(t))
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

var ICO = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m20 6-11 11-5-5"/></svg>',
  alerta: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
  cerrar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  sobre: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></svg>',
  marca: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
  sol: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  luna: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  ficha: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h4"/></svg>',
  vacio: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 13V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h7"/><path d="M8 9h8M8 13h5"/></svg>'
};

function flotante(texto) {
  var f = document.getElementById('flotante');
  f.textContent = texto;
  f.classList.add('visible');
  clearTimeout(f._t);
  f._t = setTimeout(function () { f.classList.remove('visible'); }, 3400);
}

function aviso(texto, tipo) {
  var icono = tipo === 'mal' || tipo === 'avisa' ? ICO.alerta : ICO.check;
  return '<div class="aviso ' + (tipo || 'ok') + '">' + icono + '<div>' + esc(texto) + '</div></div>';
}

function nombreEstado(id) {
  for (var i = 0; i < estados.length; i++) if (estados[i].id === id) return estados[i].nombre;
  return id || '—';
}

/** Acepta ISO o dd/mm/aaaa, que es como escribe el formulario del sitio. */
function aFecha(valor) {
  if (!valor) return null;
  var t = String(valor).trim();
  var m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  var d = m ? new Date(+m[3], +m[2] - 1, +m[1]) : new Date(t);
  return isNaN(d.getTime()) ? null : d;
}

function fecha(valor) {
  var d = aFecha(valor);
  if (!d) return valor ? String(valor) : '';
  var hoy = new Date();
  var hora = d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
  if (d.toDateString() === hoy.toDateString()) return 'Hoy ' + hora;
  return d.toLocaleDateString('es-AR', { day: 'numeric', month: 'short' }) +
         (d.getFullYear() !== hoy.getFullYear() ? ' ' + d.getFullYear() : '') + ', ' + hora;
}

/** Fecha en que la familia completó el formulario, sin hora. */
function fechaCorta(valor) {
  var d = aFecha(valor);
  if (!d) return '—';
  return d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function iniciales(nombre) {
  return (nombre || '?').trim().split(/\s+/).slice(0, 2)
    .map(function (p) { return p[0]; }).join('').toUpperCase();
}

function esVerdadero(v) { return v === true || v === 'TRUE' || v === 'true'; }

/* ─── Arranque ─── */

function arrancar() {
  api('sesion').then(function (r) {
    if (!r.ok) { document.getElementById('lista').innerHTML = aviso(r.error, 'mal'); return; }

    sesion = r.usuario;
    estados = r.estados;

    document.getElementById('uNombre').textContent = sesion.nombre || sesion.email;
    document.getElementById('uNiveles').textContent =
      sesion.rol === 'admin' ? 'Todos los niveles' : sesion.niveles.join(' · ');
    document.getElementById('uAvatar').textContent = iniciales(sesion.nombre || sesion.email);
    document.getElementById('login').classList.remove('visible');
    cargar();
  }).catch(function (e) {
    document.getElementById('lista').innerHTML = aviso(e.message, 'mal');
  });
}

function cargar() {
  var lista = document.getElementById('lista');
  if (!admisiones.length) {
    lista.innerHTML = '<div class="esqueleto"></div><div class="esqueleto"></div><div class="esqueleto"></div>';
  }

  api('listar', filtros).then(function (r) {
    if (!r.ok) { lista.innerHTML = aviso(r.error, 'mal'); return; }
    admisiones = r.admisiones;
    pintarLista();
  }).catch(function (e) { lista.innerHTML = aviso(e.message, 'mal'); });
}

/**
 * Cuán urgente es una espera. Las tres situaciones tienen umbrales distintos
 * a propósito: que una familia nos haya respondido y no le contestemos es
 * peor que estar esperando que conteste ella.
 */
function urgencia(espera) {
  if (!espera || espera.dias === null || espera.dias === undefined) return null;
  var d = espera.dias;

  if (espera.tipo === 'nos_responden') return d >= 1 ? 'nuestra' : 'tranquilo';
  if (espera.tipo === 'sin_contactar') return d >= 3 ? 'urgente' : (d >= 1 ? 'atencion' : 'tranquilo');
  if (espera.tipo === 'esperando')     return d >= 8 ? 'urgente' : (d >= 3 ? 'atencion' : 'tranquilo');
  return null;
}

var RELOJ = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function textoEspera(espera) {
  var nivel = urgencia(espera);
  if (!nivel) return '';

  var d = espera.dias;
  var cuanto = d === 0 ? 'hoy' : (d === 1 ? '1 día' : d + ' días');
  var que = {
    sin_contactar: 'sin contactar',
    esperando: 'esperando respuesta',
    nos_responden: 'respondieron hace'
  }[espera.tipo];

  var texto = espera.tipo === 'nos_responden'
    ? 'Respondieron hace ' + cuanto
    : cuanto + ' ' + que;

  return '<span class="espera ' + nivel + '" title="' + esc(texto) + '">' +
    RELOJ + esc(d === 0 ? 'Hoy' : d + 'd') + '</span>';
}

/**
 * En qué punto está la admisión, para el color de la franja.
 *
 *   verde     matriculada
 *   amarillo  en proceso: contactada, entrevistas, visita
 *   rojo      sin contactar todavía, o demasiados días sin movimiento
 *   gris      cerrada sin matrícula
 *
 * La urgencia gana sobre la etapa: una entrevista agendada hace tres semanas
 * sin respuesta no es "en proceso", es un problema.
 */
function colorSituacion(a) {
  if (a.estado === 'matriculada') return 'verde';
  if (a.estado === 'sin_vacante' || a.estado === 'desistio') return 'gris';

  if (urgencia(a.espera) === 'urgente' || urgencia(a.espera) === 'nuestra') return 'rojo';
  if (a.estado === 'nueva') return 'rojo';

  return 'amarillo';
}

function pintarLista() {
  var lista = document.getElementById('lista');

  var pendientes = admisiones.filter(function (a) { return urgencia(a.espera) === 'urgente' || urgencia(a.espera) === 'nuestra'; });
  document.getElementById('resumen').innerHTML = admisiones.length
    ? '<b>' + admisiones.length + '</b> admisiones' +
      (pendientes.length ? ' · <b>' + pendientes.length + '</b> necesitan atención' : '')
    : '';

  if (!admisiones.length) {
    lista.innerHTML = '<div class="vacio">' + ICO.vacio +
      '<p>No hay admisiones todavía. Probá con “Importar del sitio”.</p></div>';
    return;
  }

  lista.innerHTML = '<div class="grilla">' + admisiones.map(function (a) {
    return '<article class="tarjeta s-' + colorSituacion(a) + '" data-id="' + esc(a.id) + '" tabindex="0">' +
      '<div class="arriba">' +
        '<div class="principal">' +
          '<div class="meta" style="margin:0 0 3px">' +
            '<span>' + esc(fechaCorta(a.fecha_alta)) + '</span>' +
            '<span class="nivel n-' + esc(a.nivel) + '">' + esc(a.nivel) + '</span>' +
            (esVerdadero(a.inclusion_solicitada)
              ? '<span class="marca-inclusion">inclusión</span>' : '') +
          '</div>' +
          '<div class="nombre" title="' + esc(a.alumno_nombre) + '">' +
            esc(a.alumno_nombre) + '</div>' +
          '<div class="sub">' + esc(a.grado_solicitado || '—') +
            ' — ' + esc(a.anio_vacante || '—') + '</div>' +
        '</div>' +
        miniPasos(a) +
        '<div class="derecha">' +
          textoEspera(a.espera) +
          chipRama(a) +
          '<div class="acciones-fila">' +
            '<button data-mail-de="' + esc(a.id) + '" title="Enviar mail">' + ICO.sobre + '</button>' +
            (a.pdf_url
              ? '<button data-pdf="' + esc(a.pdf_url) + '" title="Ver ficha">' + ICO.ficha + '</button>'
              : '<button class="apagado" title="Todavía sin ficha">' + ICO.ficha + '</button>') +
          '</div>' +
        '</div>' +
      '</div>' +
    '</article>';
  }).join('') + '</div>';

  // Cada acción frena la propagación: sin eso el click llega también a la
  // tarjeta y se abre la ficha detrás de lo que se acaba de hacer.
  Array.prototype.forEach.call(lista.querySelectorAll('[data-pdf]'), function (b) {
    b.onclick = function (ev) {
      ev.stopPropagation();
      window.open(b.dataset.pdf, '_blank');
    };
  });

  Array.prototype.forEach.call(lista.querySelectorAll('[data-mail-de]'), function (b) {
    b.onclick = function (ev) {
      ev.stopPropagation();
      abrirMail(b.dataset.mailDe);
    };
  });

  Array.prototype.forEach.call(lista.querySelectorAll('[data-estado-de]'), function (b) {
    b.onclick = function (ev) {
      ev.stopPropagation();
      abrirMenuEstado(b, b.dataset.estadoDe);
    };
  });

  Array.prototype.forEach.call(lista.querySelectorAll('[data-paso-a]'), function (b) {
    b.onclick = function (ev) {
      ev.stopPropagation();
      abrirPasoRapido(b, b.dataset.pasoDe, b.dataset.pasoA);
    };
  });

  Array.prototype.forEach.call(lista.querySelectorAll('.tarjeta'), function (t) {
    t.onclick = function () { abrirPanel(t.dataset.id); };
    t.onkeydown = function (ev) {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); abrirPanel(t.dataset.id); }
    };

/* ─── Menú de estado desde la lista ─── */

var menuAbierto = null;

function cerrarMenuEstado() {
  if (menuAbierto) { menuAbierto.remove(); menuAbierto = null; }
}

/**
 * El recorrido dentro de la tarjeta: el mismo checkpoint del panel, en chico.
 *
 * Los tres desvíos (lista de espera, sin vacante, desistió) no van como
 * pastillas acá: son un bloque aparte que en una lista de cincuenta familias
 * duplica el alto de todo el dashboard. Quedan detrás del botón del final,
 * que muestra el nombre y el color cuando la admisión está en uno.
 */
function miniPasos(a) {
  var enRama = ramaActual(a);

  var pasos = dibujarPasos(a, function (e) {
    return 'data-paso-de="' + esc(a.id) + '" data-paso-a="' + esc(e.id) + '"';
  });

  return '<div class="medio"><div class="pasos chico">' + pasos + '</div></div>';
}

/** El botón de los desvíos, que vive con el resto de las acciones de la fila. */
function chipRama(a) {
  var enRama = ramaActual(a);
  return '<button class="rama-chip' + (enRama ? ' activa-' + esc(enRama.id) : '') + '" ' +
    'data-estado-de="' + esc(a.id) + '" title="Lista de espera, sin vacante, desistió">' +
    (enRama ? esc(enRama.nombre) : '···') +
  '</button>';
}

/**
 * Confirmación al tocar un punto del recorrido.
 *
 * Un solo click no alcanza: los puntos son chicos y están pegados, y el error
 * se registra en Eventos y le cambia el color a la tarjeta. El paso extra es
 * además donde entra la nota, que es cuando se sabe por qué.
 */
function abrirPasoRapido(boton, id, destino) {
  cerrarMenuEstado();

  var a = null;
  for (var i = 0; i < admisiones.length; i++) if (admisiones[i].id === id) a = admisiones[i];
  if (!a) return;
  if (destino === a.estado) return;

  var caja = document.createElement('div');
  caja.className = 'popover';
  caja.innerHTML =
    '<div class="destino">' + esc(nombreEstado(a.estado)) + ' → ' + esc(nombreEstado(destino)) +
      '<small>' + esc(a.alumno_nombre) + '</small></div>' +
    '<input id="notaPasoRapido" placeholder="Nota del cambio (opcional)">' +
    '<div class="botones">' +
      '<button data-cancelar="1">Cancelar</button>' +
      '<button class="primario" data-confirmar="1">Marcar</button>' +
    '</div>';

  document.body.appendChild(caja);
  menuAbierto = caja;
  anclarMenu(caja, boton);

  caja.querySelector('[data-cancelar]').onclick = cerrarMenuEstado;
  caja.querySelector('[data-confirmar]').onclick = function () {
    var nota = document.getElementById('notaPasoRapido').value;
    cerrarMenuEstado();
    api('cambiarEstado', { id: id, estado: destino, nota: nota }).then(function (r) {
      if (!r.ok) { flotante('Error: ' + r.error); return; }
      cargar();
      flotante(a.alumno_nombre + ' → ' + nombreEstado(destino));
    });
  };

  var campo = document.getElementById('notaPasoRapido');
  if (campo) {
    campo.focus();
    campo.onkeydown = function (ev) {
      if (ev.key === 'Enter') caja.querySelector('[data-confirmar]').click();
      if (ev.key === 'Escape') cerrarMenuEstado();
    };
  }

  caja.onclick = function (ev) { ev.stopPropagation(); };
  setTimeout(function () {
    document.addEventListener('click', cerrarMenuEstado, { once: true });
  }, 0);
}

/**
 * Ancla un menú o popover al botón que lo abrió, corregido para no salirse
 * de la pantalla: abajo si entra, arriba si no, y sin pasarse de los bordes.
 */
function anclarMenu(caja, boton) {
  var r = boton.getBoundingClientRect();
  var alto = caja.offsetHeight;
  var arriba = r.bottom + 6 + alto > window.innerHeight && r.top - alto - 6 > 0;

  caja.style.top = (window.scrollY + (arriba ? r.top - alto - 6 : r.bottom + 6)) + 'px';
  caja.style.left = Math.max(10,
    Math.min(window.scrollX + r.left, window.scrollX + window.innerWidth - caja.offsetWidth - 10)) + 'px';
}

/**
 * Menú para cambiar el estado sin abrir la ficha, con un campo de nota.
 *
 * La nota se pide en el mismo paso porque es cuando se sabe por qué: "no
 * contestó dos mails", "pidió esperar al año que viene". Preguntarla después,
 * en otra pantalla, es garantía de que nadie la escriba.
 */
function abrirMenuEstado(boton, id) {
  cerrarMenuEstado();

  var a = null;
  for (var i = 0; i < admisiones.length; i++) if (admisiones[i].id === id) a = admisiones[i];
  if (!a) return;

  var menu = document.createElement('div');
  menu.className = 'menu-estado';

  var flujo = estados.filter(function (e) { return Number(e.orden) <= ORDEN_MAXIMO_FLUJO; });
  var ramas = estados.filter(function (e) { return Number(e.orden) > ORDEN_MAXIMO_FLUJO; });

  function opciones(lista) {
    return lista.map(function (e) {
      return '<button class="opcion e-' + esc(e.id) + (e.id === a.estado ? ' actual' : '') +
        '" data-ir="' + esc(e.id) + '" style="background:none">' +
        '<span class="bolita-estado"></span>' + esc(e.nombre) +
        (e.id === a.estado ? ' ·' : '') + '</button>';
    }).join('');
  }

  menu.innerHTML =
    '<div class="ayuda">' + esc(a.alumno_nombre) + '</div>' +
    opciones(flujo) +
    '<div class="separador"></div>' +
    opciones(ramas) +
    '<div class="separador"></div>' +
    '<input class="nota" id="notaEstadoRapida" placeholder="Nota del cambio (opcional)">';

  document.body.appendChild(menu);
  menuAbierto = menu;

  anclarMenu(menu, boton);

  Array.prototype.forEach.call(menu.querySelectorAll('[data-ir]'), function (b) {
    b.onclick = function () {
      var nota = document.getElementById('notaEstadoRapida').value;
      var destino = b.dataset.ir;
      cerrarMenuEstado();
      if (destino === a.estado) return;

      api('cambiarEstado', { id: id, estado: destino, nota: nota }).then(function (r2) {
        if (!r2.ok) { flotante('Error: ' + r2.error); return; }
        cargar();
        flotante(a.alumno_nombre + ' → ' + nombreEstado(destino));
      });
    };
  });

  // Un click afuera cierra; el de adentro no debe burbujear a la tarjeta
  menu.onclick = function (ev) { ev.stopPropagation(); };
  setTimeout(function () {
    document.addEventListener('click', cerrarMenuEstado, { once: true });
  }, 0);
}

/**
 * Checkpoints del recorrido.
 *
 * Los estados con orden hasta 60 son el camino normal y se dibujan como
 * pasos; los de 70 en adelante son desvíos (lista de espera, sin vacante,
 * desistió) y van aparte, porque no forman una secuencia.
 *
 * Todo lo anterior al estado actual se pinta como cumplido, así se ve de un
 * vistazo dónde está la familia sin tener que leer el historial.
 */
var ORDEN_MAXIMO_FLUJO = 60;

var TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5"><path d="m20 6-11 11-5-5"/></svg>';

/** El desvío en el que está la admisión, o null si sigue en el recorrido. */
function ramaActual(a) {
  var encontrada = null;
  estados.forEach(function (e) {
    if (e.id === a.estado && Number(e.orden) > ORDEN_MAXIMO_FLUJO) encontrada = e;
  });
  return encontrada;
}

/**
 * Hasta qué etapa del recorrido llegó la admisión, como índice de `flujo`.
 *
 * En un desvío el estado actual no es una etapa, así que se mira
 * `estado_previo`: dice hasta dónde había llegado la familia antes de
 * desistir o de quedar en lista de espera, que es lo que hay que ver.
 */
function hastaDondeLlego(a, flujo) {
  var referencia = ramaActual(a) ? a.estado_previo : a.estado;
  var hasta = -1;
  flujo.forEach(function (e, i) { if (e.id === referencia) hasta = i; });
  return hasta;
}

/**
 * El checkpoint: una bolita por etapa, con tilde verde en las cumplidas, la
 * actual resaltada y las que faltan en gris.
 *
 * Lo comparten el panel y la tarjeta del dashboard, para que el recorrido se
 * lea igual en los dos lados. Lo único que cambia es cómo se engancha el
 * click, que viene en `atributos`.
 */
function dibujarPasos(a, atributos) {
  var flujo = estados.filter(function (e) { return Number(e.orden) <= ORDEN_MAXIMO_FLUJO; });
  var enRama = ramaActual(a);
  var hasta = hastaDondeLlego(a, flujo);

  return flujo.map(function (e, i) {
    // En un desvío no hay etapa "actual": el recorrido quedó interrumpido, y
    // lo que importa es hasta dónde había llegado.
    var clase = enRama
      ? (i <= hasta ? 'hecho' : '')
      : (i < hasta ? 'hecho' : (i === hasta ? 'actual' : ''));

    return '<button class="paso ' + clase + '" ' + atributos(e) + ' ' +
      'title="Marcar como ' + esc(e.nombre) + '">' +
      '<span class="bolita">' + TICK + '</span>' +
      '<span class="rotulo">' + esc(e.nombre) + '</span>' +
    '</button>';
  }).join('');
}

function pintarPasos(a) {
  var ramas = estados.filter(function (e) { return Number(e.orden) > ORDEN_MAXIMO_FLUJO; });

  var pasos = dibujarPasos(a, function (e) {
    return 'data-ir-a="' + esc(e.id) + '"';
  });

  var desvios = ramas.map(function (e) {
    return '<button class="rama ' + (e.id === a.estado ? 'activa-' + esc(e.id) : '') + '" ' +
      'data-ir-a="' + esc(e.id) + '">' + esc(e.nombre) + '</button>';
  }).join('');

  return '<div class="pasos">' + pasos + '</div>' +
    (desvios ? '<div class="ramas">' + desvios + '</div>' : '');
}

var NOMBRE_EVENTO = {
  alta: 'Alta desde el formulario', mail_enviado: 'Mail enviado',
  mail_recibido: 'Respuesta de la familia', llamada: 'Llamada telefónica',
  cambio_estado: 'Cambio de estado', nota: 'Nota interna', pdf_generado: 'Ficha generada'
};

function pintarRecorrido(eventos) {
  if (!eventos.length) {
    return '<div class="bloque" style="text-align:center;color:var(--texto-suave);padding:24px">' +
      'Todavía no hay movimientos.</div>';
  }
  return '<div class="recorrido">' + eventos.map(function (e) {
    // Sólo los cambios de estado se pueden deshacer: un mail ya salió y una
    // respuesta de la familia ocurrió, borrarlos sería falsear el registro.
    var deshacer = e.tipo === 'cambio_estado'
      ? '<button class="deshacer" data-evento="' + esc(e.id) + '" ' +
        'title="Deshacer este cambio de estado">' + ICO.cerrar + '</button>'
      : '';

    return '<div class="hito ' + esc(e.tipo) + '">' +
      deshacer +
      '<div class="cuando">' + esc(fecha(e.timestamp)) + ' · ' + esc(e.usuario) + '</div>' +
      '<div class="titulo">' + esc(NOMBRE_EVENTO[e.tipo] || e.tipo) +
        (e.asunto ? ' — ' + esc(nombreTransicion(e.asunto)) : '') + '</div>' +
      (e.detalle ? '<div class="detalle">' + esc(e.detalle) + '</div>' : '') +
    '</div>';
  }).join('') + '</div>';
}

/** Traduce "nueva → contactada" a "Nueva → Contactada". */
function nombreTransicion(asunto) {
  if (!asunto || asunto.indexOf('→') === -1) return asunto;
  return asunto.split('→')
    .map(function (p) { return nombreEstado(p.trim()); })
    .join(' → ');
}

function accion(nombre, params, idRecargar, mensaje) {
  api(nombre, params).then(function (r) {
    if (!r.ok) {
      document.getElementById('avisoPanel').innerHTML = aviso(r.error, 'mal');
      return;
    }
    abrirPanel(idRecargar);
    cargar();
    if (mensaje) flotante(mensaje);
  });
}

/* ─── Mail ─── */

function cerrarModal() {
  document.getElementById('modal').classList.remove('visible');
  document.getElementById('modal').innerHTML = '';
}

function abrirMail(id, idPlantilla) {
  var m = document.getElementById('modal');
  m.classList.add('visible');
  m.innerHTML = '<div class="modal-caja"><div class="modal-cuerpo">' +
    '<div class="esqueleto"></div></div></div>';

  api('previsualizarMail', { id: id, idPlantilla: idPlantilla }).then(function (r) {
    var p = r.ok ? r.previsualizacion : null;

    if (!r.ok || !p.ok) {
      m.innerHTML = '<div class="modal-caja">' +
        '<div class="modal-cabeza"><h2>Enviar mail</h2>' +
        '<button class="cerrar" onclick="cerrarModal()">' + ICO.cerrar + '</button></div>' +
        '<div class="modal-cuerpo">' + aviso(r.error || p.motivo, 'avisa') + '</div>' +
        '<div class="modal-pie"><button onclick="cerrarModal()">Cerrar</button></div></div>';
      return;
    }

    var opciones = p.disponibles.map(function (d) {
      return '<option value="' + esc(d.id) + '"' + (d.id === p.plantilla.id ? ' selected' : '') + '>' +
        esc(d.nombre) + '</option>';
    }).join('');

    m.innerHTML = '<div class="modal-caja">' +
      '<div class="modal-cabeza"><h2>Enviar mail</h2>' +
        '<button class="cerrar" onclick="cerrarModal()">' + ICO.cerrar + '</button></div>' +

      '<div class="modal-cuerpo">' +
        '<dl class="sobre">' +
          '<div class="linea"><dt>De</dt><dd>' + esc(p.de) + '</dd></div>' +
          '<div class="linea"><dt>Para</dt><dd>' + esc(p.para) + '</dd></div>' +
          (p.copias.length ? '<div class="linea"><dt>Copia</dt><dd>' + esc(p.copias.join(', ')) + '</dd></div>' : '') +
          '<div class="linea"><dt>Responden a</dt><dd>' + esc(p.responderA.join(', ')) + '</dd></div>' +
        '</dl>' +

        (p.faltantes.length
          ? aviso('Faltan datos: ' + p.faltantes.join(', ') +
                  '. Completalos en la ficha o editá el texto antes de enviar.', 'mal')
          : '') +

        '<div id="avisoMail"></div>' +

        '<label class="etiqueta" for="selPlantilla">Plantilla</label>' +
        '<select class="ancho" id="selPlantilla">' + opciones + '</select>' +

        '<label class="etiqueta" for="asunto">Asunto</label>' +
        '<input class="ancho" id="asunto" value="' + esc(p.asunto) + '">' +

        '<label class="etiqueta" for="cuerpo">Mensaje</label>' +
        '<textarea class="ancho" id="cuerpo">' + esc(p.cuerpo) + '</textarea>' +
      '</div>' +

      '<div class="modal-pie">' +
        '<button onclick="cerrarModal()">Cancelar</button>' +
        '<button class="primario" id="bEnviar">Enviar</button>' +
      '</div></div>';

    document.getElementById('selPlantilla').onchange = function () { abrirMail(id, this.value); };

    document.getElementById('bEnviar').onclick = function () {
      var b = document.getElementById('bEnviar');
      b.disabled = true; b.textContent = 'Enviando…';

      api('enviarMail', {
        id: id,
        idPlantilla: document.getElementById('selPlantilla').value,
        asunto: document.getElementById('asunto').value,
        cuerpo: document.getElementById('cuerpo').value
      }).then(function (r) {
        if (!r.ok || !r.resultado.ok) {
          document.getElementById('avisoMail').innerHTML = aviso(r.error || r.resultado.motivo, 'mal');
          b.disabled = false; b.textContent = 'Enviar';
          return;
        }
        cerrarModal();
        abrirPanel(id);
        cargar();
        flotante('Mail enviado' + (r.resultado.copias.length ? ' · copia a ' + r.resultado.copias.join(', ') : ''));
      });
    };
  });
}

/* ─── Plantillas ─── */

function abrirPlantillas() {
  var m = document.getElementById('modal');
  m.classList.add('visible');
  m.innerHTML = '<div class="modal-caja"><div class="modal-cuerpo"><div class="esqueleto"></div></div></div>';

  api('plantillas').then(function (r) {
    if (!r.ok) {
      m.innerHTML = '<div class="modal-caja"><div class="modal-cuerpo">' + aviso(r.error, 'mal') +
        '</div><div class="modal-pie"><button onclick="cerrarModal()">Cerrar</button></div></div>';
      return;
    }
    plantillasCache = r;

    var filas = r.plantillas.map(function (p) {
      return '<article class="tarjeta" data-id="' + esc(p.id) + '" style="margin-bottom:8px">' +
        '<div class="principal">' +
          '<div class="nombre">' + esc(p.nombre) + '<span class="nivel">' + esc(p.nivel) + '</span></div>' +
          '<div class="meta">Se usa cuando: <code>' + esc(p.condicion) + '</code></div>' +
        '</div></article>';
    }).join('');

    m.innerHTML = '<div class="modal-caja">' +
      '<div class="modal-cabeza"><h2>Plantillas de mail</h2>' +
        '<button class="cerrar" onclick="cerrarModal()">' + ICO.cerrar + '</button></div>' +
      '<div class="modal-cuerpo">' +
        '<p style="color:var(--texto-suave);font-size:13px;margin-bottom:14px">' +
          'Los textos se editan acá, sin tocar código. Usá ' +
          r.campos.slice(0, 4).map(function (c) { return '<code>{{' + esc(c) + '}}</code>'; }).join(' ') +
          ' y demás para insertar los datos de cada familia.</p>' +
        filas +
      '</div></div>';

    Array.prototype.forEach.call(m.querySelectorAll('.tarjeta'), function (t) {
      t.onclick = function () {
        editarPlantilla(r.plantillas.filter(function (x) { return x.id === t.dataset.id; })[0], r.campos);
      };
    });
  });
}

function editarPlantilla(p, campos) {
  document.getElementById('modal').innerHTML = '<div class="modal-caja">' +
    '<div class="modal-cabeza"><h2>' + esc(p.nombre) + '</h2>' +
      '<button class="cerrar" onclick="cerrarModal()">' + ICO.cerrar + '</button></div>' +

    '<div class="modal-cuerpo">' +
      '<p style="color:var(--texto-suave);font-size:12.5px">Campos disponibles: ' +
        campos.map(function (c) { return '<code>{{' + esc(c) + '}}</code>'; }).join(' ') + '</p>' +

      '<div id="avisoPlantilla" style="margin-top:12px"></div>' +

      '<label class="etiqueta" for="pCond">Se usa cuando</label>' +
      '<input class="ancho" id="pCond" value="' + esc(p.condicion) + '">' +
      '<p style="color:var(--texto-suave);font-size:12px;margin-top:5px">' +
        '<code>*</code> para la plantilla por defecto, o <code>campo operador valor</code> — ' +
        'por ejemplo <code>anio_vacante &gt;= 2028</code>.</p>' +

      '<label class="etiqueta" for="pAsunto">Asunto</label>' +
      '<input class="ancho" id="pAsunto" value="' + esc(p.asunto) + '">' +

      '<label class="etiqueta" for="pCuerpo">Mensaje</label>' +
      '<textarea class="ancho" id="pCuerpo">' + esc(p.cuerpo) + '</textarea>' +
    '</div>' +

    '<div class="modal-pie">' +
      '<button onclick="abrirPlantillas()">Volver</button>' +
      '<button class="primario" id="bGuardarP">Guardar</button>' +
    '</div></div>';

  document.getElementById('bGuardarP').onclick = function () {
    api('guardarPlantilla', {
      plantilla: {
        id: p.id, nivel: p.nivel, nombre: p.nombre, prioridad: p.prioridad, activa: p.activa,
        condicion: document.getElementById('pCond').value,
        asunto: document.getElementById('pAsunto').value,
        cuerpo: document.getElementById('pCuerpo').value
      }
    }).then(function (r) {
      if (!r.ok) {
        document.getElementById('avisoPlantilla').innerHTML = aviso(r.error, 'mal');
        return;
      }
      cerrarModal();
      flotante('Plantilla guardada');
    });
  };
}

/* ─── Eventos globales ─── */

var tecleo;
document.getElementById('buscar').oninput = function () {
  filtros.texto = this.value.trim();
  clearTimeout(tecleo);
  tecleo = setTimeout(cargar, 320);
};

document.getElementById('btnPlantillas').onclick = abrirPlantillas;
document.getElementById('velo').onclick = cerrarPanel;

document.getElementById('modal').onclick = function (ev) {
  if (ev.target === this) cerrarModal();
};

document.addEventListener('keydown', function (ev) {
  if (ev.key !== 'Escape') return;

  else if (document.getElementById('modal').classList.contains('visible')) cerrarModal();
  else cerrarPanel();
});

document.getElementById('btnImportar').onclick = function () {
  var b = this;
  b.disabled = true; b.textContent = 'Importando…';
  api('importar').then(function (r) {
    b.disabled = false; b.textContent = 'Importar del sitio';
    if (!r.ok) { flotante('Error: ' + r.error); return; }
    flotante(r.resumen.importadas + ' nuevas · ' + r.resumen.salteadas + ' ya estaban');
    cargar();
  });
};

/* ─── Claro / oscuro ─── */

/**
 * Tres estados: seguir al sistema, forzar claro, forzar oscuro.
 *
 * La preferencia se guarda en localStorage, que es por navegador y por
 * persona — no se comparte ni viaja a la planilla. Si el navegador lo tiene
 * bloqueado, el sitio funciona igual siguiendo al sistema.
 */
function temaGuardado() {
  try { return localStorage.getItem('tema') || ''; } catch (e) { return ''; }
}

function guardarTema(t) {
  try { t ? localStorage.setItem('tema', t) : localStorage.removeItem('tema'); } catch (e) { /* sin persistencia */ }
}

function temaDelSistema() {
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
    ? 'dark' : 'light';
}

function aplicarTema() {
  var elegido = temaGuardado();
  var efectivo = elegido || temaDelSistema();

  if (elegido) document.documentElement.setAttribute('data-theme', elegido);
  else document.documentElement.removeAttribute('data-theme');

  var b = document.getElementById('btnTema');
  b.innerHTML = efectivo === 'dark' ? ICO.sol : ICO.luna;
  b.title = efectivo === 'dark' ? 'Pasar a modo claro' : 'Pasar a modo oscuro';
}

document.getElementById('btnTema').onclick = function () {
  var efectivo = temaGuardado() || temaDelSistema();
  guardarTema(efectivo === 'dark' ? 'light' : 'dark');
  aplicarTema();
};

if (window.matchMedia) {
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
    if (!temaGuardado()) aplicarTema();   // sólo si no eligió a mano
  });
}

aplicarTema();

/* ─── Login ─── */

function entrar(respuesta) {
  idToken = respuesta.credential;
  arrancar();
}

if (enAppsScript) {
  arrancar();
} else {
  document.getElementById('login').classList.add('visible');

  if (!URL_API || !CLIENT_ID) {
    document.getElementById('errorLogin').innerHTML =
      aviso('Falta completar URL_API y CLIENT_ID en index.html. Ver docs/sitio.md.', 'mal');
  } else {
    var s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true;
    s.onload = function () {
      google.accounts.id.initialize({
        client_id: CLIENT_ID, callback: entrar, hd: 'sancarlos.edu.ar'
      });
      google.accounts.id.renderButton(document.getElementById('botonGoogle'), {
        theme: 'outline', size: 'large', text: 'signin_with', locale: 'es', width: 300
      });
    };
    document.head.appendChild(s);
  }
}
